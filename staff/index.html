<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0806" />
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Staff" />
<title>Staff · ARMenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0806;--panel:#13100c;--ink:#f5efe6;--ink-dim:#9a9388;--ink-faint:#7a7266;
    --accent:#ff5722;--accent-2:#ffb066;--line:rgba(255,239,220,.08);
    --serif:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace;
    --ok:#7dd87d;--warn:#ffb066;--err:#f87171;
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit;color:inherit}
  button{cursor:pointer;border:none}
  a{color:inherit;text-decoration:none}

  /* Login */
  .login-cover{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:#0a0806;overflow:hidden}
  .login-cover::before{content:"";position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=2400&q=85&fm=jpg&auto=format');background-size:cover;background-position:center;filter:brightness(.32) saturate(1.2);z-index:-2}
  .login-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%,transparent 20%,rgba(10,8,6,.92) 100%);z-index:-1}
  .login-card{width:min(420px,100%);padding:40px 32px;border-radius:22px;background:linear-gradient(180deg,rgba(18,16,11,.94),rgba(10,8,6,.94));backdrop-filter:blur(20px);border:1px solid rgba(232,197,138,.18);text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.6);position:relative}
  .login-card h2{font-family:var(--serif);font-style:italic;font-size:32px;margin:14px 0 6px;background:linear-gradient(180deg,#fff,#e8c58a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-card p{color:#a89d84;font-size:13px;margin-bottom:22px}
  .login-card label{color:#a89d84}
  .login-card input{background:rgba(245,236,216,.04);border:1px solid rgba(245,236,216,.1)}
  .login-card input:focus{border-color:rgba(232,197,138,.5)}
  .login-card .btn{background:linear-gradient(135deg,#e8c58a,#d4a574);color:#0a0806;font-weight:700;box-shadow:0 14px 30px rgba(212,165,116,.35)}
  .login-card .row{margin-bottom:12px;text-align:left}
  .login-card label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:6px}
  .login-card input{width:100%;padding:14px;border-radius:10px;background:rgba(255,239,220,.03);border:1px solid var(--line);font-size:15px}
  .login-card .pin{letter-spacing:.4em;text-align:center;font-size:22px;font-weight:700}
  .login-card .slug{text-align:center;font-size:16px;font-weight:600;letter-spacing:.05em}
  .login-card .btn{width:100%;padding:16px;border-radius:12px;background:linear-gradient(135deg,#e8c58a,#d4a574);color:#0a0806;font-weight:700;font-size:14px;margin-top:6px;box-shadow:0 14px 30px rgba(212,165,116,.35)}
  .login-card .err{color:var(--err);font-size:12px;min-height:18px;margin:8px 0}

  header{position:sticky;top:0;z-index:10;background:rgba(10,8,6,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .brand .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative}
  .brand b{font-weight:800}
  .whoami{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
  .signout{background:none;color:var(--ink-dim);font-size:12px;padding:6px 10px;border-radius:8px}

  .tabs{display:flex;padding:8px 12px;gap:6px;border-bottom:1px solid var(--line);background:rgba(10,8,6,.6);position:sticky;top:52px;z-index:9}
  .tab{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-dim);background:rgba(255,239,220,.02)}
  .tab.active{background:rgba(255,87,34,.14);color:var(--accent);border:1px solid rgba(255,87,34,.28)}
  .badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-family:var(--mono);font-size:10px;background:rgba(255,87,34,.2);color:var(--accent)}

  main{padding:22px 20px;max-width:1400px}
  .view{display:none}.view.on{display:block}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:linear-gradient(180deg,rgba(255,239,220,.03),rgba(255,239,220,.005));border:1px solid var(--line);border-radius:16px;padding:16px}
  .card.new{border-color:rgba(255,87,34,.3);box-shadow:0 0 0 1px rgba(255,87,34,.14)}
  .card.prep{border-color:rgba(255,176,102,.3)}
  .card.ready{border-color:rgba(125,216,125,.3)}
  .card h4{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .status-dot.prep{background:var(--warn)}
  .status-dot.ready{background:var(--ok)}
  .card .meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.08em;margin-bottom:10px}
  .card ul{list-style:none;padding:0;margin:8px 0;font-size:14px;line-height:1.6}
  .card ul li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .card ul li:last-child{border:0}
  .card .note{background:rgba(255,176,102,.06);border-left:2px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:12px;color:var(--warn);margin-top:8px}
  .card .actions{display:flex;gap:6px;margin-top:12px}
  .card .actions button{flex:1;padding:10px;min-height:44px;min-width:44px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff}
  .btn-ok{background:rgba(125,216,125,.14);color:var(--ok);border:1px solid rgba(125,216,125,.3)}
  .btn-ghost{background:rgba(255,239,220,.05);color:var(--ink);border:1px solid var(--line)}
  .btn-err{background:rgba(248,113,113,.12);color:var(--err);border:1px solid rgba(248,113,113,.3)}

  .tables-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .tbl{aspect-ratio:1/1;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(125,216,125,.08);border:1px solid rgba(125,216,125,.3);cursor:pointer}
  .tbl.occupied{background:rgba(255,87,34,.1);border-color:rgba(255,87,34,.35)}
  .tbl.reserved{background:rgba(255,176,102,.1);border-color:rgba(255,176,102,.35)}
  .tbl.vip{background:linear-gradient(135deg,rgba(255,176,102,.15),rgba(255,87,34,.15));border-color:var(--accent-2)}
  .tbl.cleaning{background:rgba(154,147,136,.08);border-color:rgba(154,147,136,.3)}
  .tbl .lbl{font-family:var(--serif);font-style:italic;font-size:22px}
  .tbl .st{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}

  .flr-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:11px;color:var(--ink-dim)}
  .flr-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .flr{aspect-ratio:1/1;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;background:rgba(125,216,125,.08);border:1px solid rgba(125,216,125,.35)}
  .flr .lbl{font-family:var(--serif);font-style:italic;font-size:22px}
  .flr .st{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
  .flr.kitchen{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.5);box-shadow:0 0 8px rgba(96,165,250,.25)}
  .flr.stale{background:rgba(168,85,247,.14);border-color:rgba(168,85,247,.6);animation:flrPurple 2.4s infinite}
  .flr.call{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.7);animation:flrAmber 1.6s infinite}
  .flr.bill{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.85);animation:flrRed 1s infinite}
  @keyframes flrPurple{0%,100%{box-shadow:0 0 6px rgba(168,85,247,.3)}50%{box-shadow:0 0 16px rgba(168,85,247,.6)}}
  @keyframes flrAmber{0%,100%{box-shadow:0 0 8px rgba(251,191,36,.35)}50%{box-shadow:0 0 20px rgba(251,191,36,.75)}}
  @keyframes flrRed{0%,100%{box-shadow:0 0 10px rgba(248,113,113,.45)}50%{box-shadow:0 0 26px rgba(248,113,113,.95)}}
  @media (prefers-reduced-motion:reduce){.flr{animation:none!important}}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-dim)}
  .empty h3{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);margin-bottom:6px}


  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:360px;width:100%}
  .modal h3{font-family:var(--serif);font-style:italic;font-size:22px;margin-bottom:12px}
  .modal .opt{display:flex;justify-content:space-between;padding:14px 16px;border-radius:10px;background:rgba(255,239,220,.03);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
  .modal .opt:hover{border-color:var(--accent)}
  .modal textarea{width:100%;min-height:80px;padding:12px;border-radius:10px;background:rgba(255,239,220,.03);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical;margin-bottom:12px}
  .modal .row{display:flex;gap:8px}
  .modal .row button{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;min-height:44px}

  /* Connectivity heartbeat banner — hidden unless the last poll/SSE tick is stale */
  #offlineBanner{display:none;padding:10px 16px;text-align:center;background:rgba(248,113,113,.14);border-bottom:1px solid var(--err);color:var(--err);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  #offlineBanner.show{display:block}
</style>
<script src="/vendor/armenu-errorbar.js" defer></script>
<script src="/vendor/armenu-sounds.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-a11y.css">
  <script src="/vendor/sentry-client.js" defer></script>
<script src="/vendor/cookie-consent.js" defer></script>
<script src="/vendor/push-optin.js" defer></script>
</head>
<body>

<div id="offlineBanner">⚠ Offline — orders may not appear</div>

<div class="login-cover" id="login">
  <div class="login-card">
    <div style="display:flex;justify-content:center;margin-bottom:8px"><img src="/favicon.svg" alt="ARMenu" style="width:60px;height:60px;filter:drop-shadow(0 10px 24px rgba(212,165,116,.4))" /></div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;color:#a89d84;text-transform:uppercase;margin-top:4px">Staff console</div>
    <h2>Sign in</h2>
    <p>Enter your restaurant code and PIN.</p>
    <div class="row"><label>Restaurant code</label><input id="loginSlug" class="slug" placeholder="restaurant-slug" autocomplete="off" /></div>
    <div class="row"><label>Your PIN</label><input id="loginPin" class="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" /></div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">Sign in →</button>
  </div>
</div>

<header>
  <div class="brand"><img src="/favicon.svg" alt="ARMenu" style="width:24px;height:24px" /><b>AR</b><span style="color:var(--ink-dim);font-weight:500;margin-left:3px">Menu · Staff</span></div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="signout" id="rushPill" style="display:none;color:var(--warn);border-color:var(--warn)" aria-label="Rush order waiting - jump to oldest new order">⚡ RUSH</button>
    <button class="signout" id="pwaInstall" style="display:none" aria-label="Install as app">📱 Install as app</button>
  <span class="whoami" id="whoami"></span>
    <button class="signout" id="signout">Sign out</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="orders">Orders <span class="badge" id="ordersBadge" style="display:none">0</span></button>
  <button class="tab" data-tab="calls">Calls <span class="badge" id="callsBadge" style="display:none">0</span></button>
  <button class="tab" data-tab="tables">Tables</button>
  <button class="tab" data-tab="floor">🗺 Floor</button>
</nav>

<main>
  <div class="view on" id="view-orders"><div class="grid"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div></div>
  <div class="view" id="view-calls"><div class="grid"><div class="sk-card"></div><div class="sk-card"></div></div></div>
  <div class="view" id="view-tables"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
  <div class="view" id="view-floor"><div class="sk-line"></div><div class="sk-line"></div></div>
</main>

<div class="modal-overlay" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
const $ = id => document.getElementById(id);
const toast = (m, k='ok') => window.ArmenuFX?.toast(m, { type: k === 'err' ? 'error' : 'success' });

let session = null;
try { session = JSON.parse(localStorage.getItem('armenu_staff_session') || 'null'); } catch {}
// Manager hand-off: /staff/?r=<slug>&portal_token=<...> → auto-login
(() => {
  const q = new URLSearchParams(location.search);
  const r = q.get('r'); const pt = q.get('portal_token');
  if (r && pt) {
    fetch('/api/staff/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ r, portal_token: pt }) })
      .then(res => res.json()).then(data => {
        if (data.token) {
          session = data;
          localStorage.setItem('armenu_staff_session', JSON.stringify(session));
          history.replaceState({}, '', '/staff/');
          location.reload();
        }
      }).catch(() => {});
  }
})();
let poll = null;

// ---- Heartbeat / offline detection ----
// lastTickAt is bumped on every successful poll or SSE event. If 15s pass
// without one, we assume the network dropped and warn the operator.
let hbTimer = null;
let lastTickAt = Date.now();
function markTick() { lastTickAt = Date.now(); hideOfflineBanner(); }
function showOfflineBanner() { $('offlineBanner')?.classList.add('show'); }
function hideOfflineBanner() { $('offlineBanner')?.classList.remove('show'); }
function checkHeartbeat() {
  if (!session) return;
  if (Date.now() - lastTickAt > 15000) showOfflineBanner();
}

// ---- Notification fallback ----
// Browser Notification API as a visual fallback for when sound fails
// (suspended tab, muted device). No-op wherever unsupported.
function ensureNotifyPermission() {
  try {
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } catch {}
}
function fireStaffNotification(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification(title, { body, tag: 'armenu-staff-alert' });
  } catch {}
}

// ---- Tab title / favicon pulse fallback ----
// Last-resort visual signal when sound + notification both fail: flash the
// tab title with an unread count and swap the favicon to a red-dot version.
// Resets as soon as the operator focuses the tab back.
const STAFF_TITLE = 'Staff';
let unreadStaff = 0;
let _faviconLink = null, _faviconOrigHref = null;
function ensureFaviconLink() {
  if (_faviconLink) return _faviconLink;
  _faviconLink = document.querySelector('link[rel="icon"]') || document.querySelector('link[rel="shortcut icon"]');
  if (!_faviconLink) { _faviconLink = document.createElement('link'); _faviconLink.rel = 'icon'; document.head.appendChild(_faviconLink); }
  _faviconOrigHref = _faviconLink.getAttribute('href') || '/favicon.svg';
  return _faviconLink;
}
function pulseFavicon(on) {
  try {
    const link = ensureFaviconLink();
    if (!on) { link.href = _faviconOrigHref; return; }
    const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d'); if (!ctx) return;
    ctx.fillStyle = '#0a0806'; ctx.beginPath(); ctx.arc(16, 16, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f87171'; ctx.beginPath(); ctx.arc(16, 16, 10, 0, Math.PI * 2); ctx.fill();
    link.href = canvas.toDataURL('image/png');
  } catch {}
}
function bumpUnreadStaff(n) {
  if (!document.hidden) return; // operator is already looking at the console
  unreadStaff += n;
  document.title = `(${unreadStaff}) ${STAFF_TITLE}`;
  pulseFavicon(true);
}
function resetUnreadStaff() {
  unreadStaff = 0;
  document.title = STAFF_TITLE + ' · ARMenu';
  pulseFavicon(false);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resetUnreadStaff(); });
window.addEventListener('focus', resetUnreadStaff);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      ...(session?.token ? { authorization: 'Bearer ' + session.token } : {}),
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) { signOut(); throw new Error('unauth'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ============ LOGIN ============
$('loginBtn').onclick = async () => {
  const r = $('loginSlug').value.trim().toLowerCase();
  const pin = $('loginPin').value.trim();
  if (!r || !pin) return $('loginErr').textContent = 'Both fields required';
  $('loginErr').textContent = '';
  const btn = $('loginBtn'); if (btn.disabled) return;
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span>Signing in…';
  ensureNotifyPermission(); // first user interaction — safe point to ask
  try {
    const res = await fetch('/api/staff/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ r, pin }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    session = data;
    localStorage.setItem('armenu_staff_session', JSON.stringify(session));
    onLoggedIn();
  } catch (e) {
    $('loginErr').textContent = e.message;
    btn.disabled = false; btn.innerHTML = orig;
  }
};
$('loginPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

function signOut() {
  localStorage.removeItem('armenu_staff_session');
  session = null;
  if (poll) clearInterval(poll);
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  try { es?.close(); } catch {}
  hideOfflineBanner();
  resetUnreadStaff();
  $('login').style.display = 'grid';
}
$('signout').onclick = signOut;

// Idle timeout — auto-signout after 12h idle (one full shift + safety margin).
// A staff tablet left unlocked on the counter with an active session is a scope
// leak: whoever picks it up sees the order queue. Any pointer/key/touch resets.
const IDLE_MS = 12 * 60 * 60 * 1000;
let _idleAt = Date.now();
['pointerdown', 'keydown', 'touchstart', 'mousemove'].forEach(ev =>
  window.addEventListener(ev, () => { _idleAt = Date.now(); }, { passive: true })
);
setInterval(() => {
  if (session && Date.now() - _idleAt > IDLE_MS) {
    toast('Signed out — tablet was idle for 12h');
    signOut();
  }
}, 60_000);

function onLoggedIn() {
  $('login').style.display = 'none';
  $('whoami').textContent = `${session.staff.name} · ${session.restaurant.name}`;
  // Idempotent: clear any prior poll from an earlier session (rare, but
  // prevents timer leaks if this ever runs twice).
  if (poll) { clearInterval(poll); poll = null; }
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  lastTickAt = Date.now();
  hideOfflineBanner();
  refresh();
  poll = setInterval(refresh, 15000);   // fallback poll — SSE handles instant updates
  hbTimer = setInterval(checkHeartbeat, 5000);
  startSSE();
  registerCmdK();
}

// Command palette — skipped on touch-only kiosks (speed over discoverability).
// Registers once; commands call the same functions the on-screen buttons do.
let _cmdkRegistered = false;
function registerCmdK() {
  if (_cmdkRegistered || !window.ArmenuCmdK) return;
  if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return;
  _cmdkRegistered = true;
  window.ArmenuCmdK.register([
    { id: 'new-orders', label: 'New orders', hint: 'Go to Orders tab', run: () => document.querySelector('.tab[data-tab="orders"]').click() },
    { id: 'tables', label: 'Tables', hint: 'Go to Tables tab', run: () => document.querySelector('.tab[data-tab="tables"]').click() },
    { id: 'waiter-calls', label: 'Waiter calls', hint: 'Go to Calls tab', run: () => document.querySelector('.tab[data-tab="calls"]').click() },
    { id: 'sign-out', label: 'Sign out', run: signOut },
    { id: 'toggle-sounds', label: 'Turn sounds off/on', run: () => toast(window.ArMenuSound?.toggle() ? 'Sounds off' : 'Sounds on') },
    { id: 'refresh', label: 'Refresh', run: refresh }
  ]);
}

let es = null;
function startSSE() {
  try { es?.close(); } catch {}
  es = new EventSource('/api/events?token=' + encodeURIComponent(session.token));
  es.onopen = () => markTick();
  es.addEventListener('orders', () => { markTick(); refresh(); });
  es.addEventListener('calls', () => { markTick(); refresh(); });
  es.onerror = () => { try { es.close(); } catch {} setTimeout(startSSE, 4000); };
}

// ============ TABS ============
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('view-' + t.dataset.tab).classList.add('on');
  refresh();
});

async function refresh() {
  if (!session) return;
  const active = document.querySelector('.tab.active').dataset.tab;
  try {
    // Always refresh badges
    const [oResp, cResp] = await Promise.all([
      api('/api/staff/orders'),
      api('/api/staff/calls').catch(() => ({ calls: [] }))
    ]);
    markTick();
    const activeOrders = (oResp.orders || []).filter(o => o.status !== 'served');
    window.__servedOrders = (oResp.orders || []).filter(o => o.status === 'served')
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 10);
    updateRushPill(activeOrders);
    const openCalls = (cResp.calls || []).filter(c => c.status !== 'closed');
    // Play sounds on NEW items only (compare against previous snapshots)
    const oIds = new Set(activeOrders.map(o => o.id));
    const cIds = new Set(openCalls.map(c => c.id));
    let newOrders = 0, newCalls = 0;
    for (const id of oIds) if (!(window.__prevOids || new Set()).has(id) && window.__prevOids) { window.ArMenuSound?.play('order'); newOrders++; }
    for (const id of cIds) if (!(window.__prevCids || new Set()).has(id) && window.__prevCids) { window.ArMenuSound?.play('call'); newCalls++; }
    if (newOrders > 0) fireStaffNotification(newOrders > 1 ? `${newOrders} new orders` : 'New order', 'New order in the queue');
    if (newCalls > 0) fireStaffNotification(newCalls > 1 ? `${newCalls} waiter calls` : 'Waiter call', 'A guest needs assistance');
    if (newOrders > 0 || newCalls > 0) bumpUnreadStaff(newOrders + newCalls);
    window.__prevOids = oIds; window.__prevCids = cIds;
    updateBadge('ordersBadge', activeOrders.length);
    updateBadge('callsBadge', openCalls.length);
    window.__floor = { orders: activeOrders, calls: openCalls };

    if (active === 'orders') renderOrders(activeOrders);
    if (active === 'calls')  renderCalls(openCalls);
    if (active === 'floor') {
      renderFloor((await api('/api/staff/tables')).tables || []);
      await loadWaitlist();
    }
    if (active === 'tables') renderTables((await api('/api/staff/tables')).tables || []);
  } catch (e) { if (e.message !== 'unauth') console.error(e); }
}

function updateBadge(id, n) {
  const el = $(id);
  if (!n) { el.style.display = 'none'; } else { el.style.display = 'inline-block'; el.textContent = n; }
}

function updateRushPill(orders) {
  const pill = $('rushPill'); if (!pill) return;
  pill.style.display = (orders || []).some(o => o.rush === true) ? '' : 'none';
}
$('rushPill').onclick = () => {
  const news = Array.from(document.querySelectorAll('#view-orders .card.new'));
  const el = news.sort((a, b) => Number(a.dataset.created) - Number(b.dataset.created))[0];
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.outline = '2px solid var(--warn)'; setTimeout(() => { el.style.outline = ''; }, 2000); }
};

function itemAllergens(it) {
  const a = it.allergens ?? it.dish?.allergens ?? it.dishes?.allergens;
  const list = Array.isArray(a) ? a : (typeof a === 'string' ? a.split(',') : []);
  return list.map(x => String(x).trim()).filter(Boolean);
}

function renderOrders(orders) {
  const served = window.__servedOrders || [];
  window.__ordersById = Object.fromEntries(orders.concat(served).map(o => [o.id, o])); // for openSplitBill + recall lookup
  const sym = 'R';
  const recallBtn = o => (o.status === 'ready' || o.status === 'served') ? `<button class="btn-ghost" data-recall="${o.id}" style="min-height:44px;font-size:12px">↶ Recall to kitchen</button>` : '';
  const servedHTML = served.length ? `<h3 style="margin:22px 0 8px;font-size:13px;color:var(--ink-dim)">Recent · Served</h3><div class="grid">${served.map(o => `
    <div class="card served">
      <h4><span class="status-dot served"></span>${o.table_label ? `Table ${escapeHTML(o.table_label)}` : 'Walk-up'}</h4>
      <div class="meta">${new Date(o.created_at).toLocaleTimeString()}</div>
      <ul>${(o.order_items || []).map(it => `<li><span>${it.qty}× ${escapeHTML(it.dish_name)}</span></li>`).join('')}</ul>
      <div class="actions">${recallBtn(o)}</div>
    </div>`).join('')}</div>` : '';
  if (!orders.length) {
    $('view-orders').innerHTML = `<div class="empty-state" data-icon="📋"><h3>No active orders</h3><p>New orders appear here the moment a guest places one.</p></div>` + servedHTML;
    bindRecall();
    return;
  }
  $('view-orders').innerHTML = `<div class="grid">${orders.map(o => `
    <div class="card ${o.status}" data-created="${new Date(o.created_at).getTime()}">
      <h4><span class="status-dot ${o.status}"></span>${o.table_label ? `Table ${escapeHTML(o.table_label)}` : 'Walk-up'}</h4>
      <div class="meta">${new Date(o.created_at).toLocaleTimeString()} · ${o.source === 'staff' ? 'Staff-taken' : 'Guest self-order'}</div>
      <ul>${(o.order_items || []).map(it => `<li>
        <span>${it.qty}× ${escapeHTML(it.dish_name)}${it.note ? ` <em style="color:var(--warn);font-style:normal">· ${escapeHTML(it.note)}</em>` : ''}${it.complimentary ? ' <span style="color:var(--ok)">(comp)</span>' : ''}
        ${itemAllergens(it).length ? `<div class="allergen-chip" style="margin:3px 0 0 20px;font-size:11.5px;color:var(--warn);font-weight:600">⚠ allergens: ${escapeHTML(itemAllergens(it).join(', '))}</div>` : ''}
        ${Array.isArray(it.modifiers) && it.modifiers.length ? '<div style="margin-left:20px;font-size:11.5px;color:var(--warn)">' + it.modifiers.map(m => '↳ ' + escapeHTML(m.name)).join('<br>') + '</div>' : ''}
        </span>
        <span>${it.price_cents ? sym + (it.price_cents * it.qty / 100).toFixed(2) : ''}</span>
      </li>`).join('')}</ul>
      ${o.guest_note ? `<div class="note">📝 ${escapeHTML(o.guest_note)}</div>` : ''}
      ${o.total_cents ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-dim)">
        <span>Total <b style="color:var(--ink);font-size:14px">R${(o.total_cents/100).toFixed(2)}</b>${o.tip_cents ? ` <span style="color:var(--ok)">(+R${(o.tip_cents/100).toFixed(2)} tip)</span>` : ''}</span>
        <button class="btn-ghost" data-split="${o.id}" style="padding:8px 14px;min-height:44px;font-size:11px">Split ⋯</button>
      </div>` : ''}
      <div class="actions">
        ${o.status === 'new' ? `<button class="btn-primary" data-mark="${o.id}:prep">Start prep</button>` : ''}
        ${o.status === 'prep' ? `<button class="btn-primary" data-mark="${o.id}:ready">Ready</button>` : ''}
        ${o.status === 'ready' ? `<button class="btn-ok" data-mark="${o.id}:served">Served</button>` : ''}
        ${recallBtn(o)}
        <button class="btn-err" data-mark="${o.id}:cancelled" aria-label="Cancel order" title="Cancel order">✕</button>
      </div>
    </div>`).join('')}</div>` + servedHTML;
  bindRecall();
  document.querySelectorAll('[data-mark]').forEach(b => b.onclick = async () => {
    const [id, status] = b.dataset.mark.split(':');
    if (status === 'cancelled') {
      const reason = await promptCancelReason();
      if (reason === null) return; // aborted
      try {
        await api('/api/staff/orders?id=' + id, { method: 'PATCH', body: JSON.stringify({ status, reason }) });
        refresh();
      } catch (e) { toast(e.message, 'err'); }
      return;
    }
    try {
      await api('/api/staff/orders?id=' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
      refresh();
    } catch (e) { toast(e.message, 'err'); }
  });
  document.querySelectorAll('[data-split]').forEach(b => b.onclick = () => {
    openSplitBill(window.__ordersById?.[b.dataset.split]);
  });
}

function bindRecall() {
  document.querySelectorAll('[data-recall]').forEach(b => b.onclick = async () => {
    const order = window.__ordersById?.[b.dataset.recall];
    if (!order || b.disabled) return;
    const reason = await promptRecallReason();
    if (reason === null) return;
    b.disabled = true;
    try {
      for (const it of (order.order_items || [])) {
        await api('/api/staff/orders?id=' + encodeURIComponent(it.id) + '&recall=' + encodeURIComponent(reason), { method: 'PATCH', body: JSON.stringify({ recall: reason }) });
      }
      toast('Recalled to kitchen');
    } catch (e) { if (e.message !== 'unauth') toast(e.message, 'err'); }
    b.disabled = false;
    refresh();
  });
}

// Split bill — two tabs. "Even split" is the original client-only calculator
// (no DB writes). "Per item" assigns each order_item to a payer label (A-H)
// and tracks partial payment server-side via PATCH /api/staff/orders.
const SPLIT_LABELS = ['A','B','C','D','E','F','G','H'];
let _splitOrder = null; // the order object currently open in the split modal

function openSplitBill(order) {
  if (!order) return;
  _splitOrder = order;
  const existing = document.getElementById('splitOverlay');

  const overlay = document.createElement('div');

  overlay.innerHTML = `
    <div style="width:min(400px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,rgba(18,16,11,.98),rgba(10,8,6,.98));border:1px solid rgba(232,197,138,.3);border-radius:18px;padding:24px;color:var(--ink)">
      <h3 style="margin:0 0 4px;font-size:18px">Split bill</h3>
      <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 14px">Total: <b style="color:var(--ink)">R${(order.total_cents/100).toFixed(2)}</b>${order.paid_cents ? ` · <b style="color:var(--ok)">R${(order.paid_cents/100).toFixed(2)} paid</b>` : ''}${order.paid_cents >= order.total_cents && order.total_cents ? ' · <b style="color:var(--ok)">✅ Fully paid</b>' : ''}</p>
      <div style="display:flex;gap:6px;margin-bottom:14px">
        <button id="spTabEven" class="tab active" style="flex:1;text-align:center">Even split</button>
        <button id="spTabItem" class="tab" style="flex:1;text-align:center">Per item</button>
      </div>
      <div id="spEvenPane"></div>
      <div id="spItemPane" style="display:none"></div>
      <button id="spClose" style="width:100%;padding:12px;border-radius:10px;background:linear-gradient(135deg,#e8c58a,#d4a574);color:#0a0806;font-weight:700;border:none;margin-top:14px">Done</button>
    </div>`;
  document.body.appendChild(overlay);
  renderEvenSplitPane(order.total_cents);
  renderPerItemPane(order);
  document.getElementById('spTabEven').onclick = () => {
    document.getElementById('spTabEven').classList.add('active');
    document.getElementById('spTabItem').classList.remove('active');

    document.getElementById('spEvenPane').style.display = 'none';
  };
  document.getElementById('spClose').onclick = () => { overlay.remove(); _splitOrder = null; };
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); _splitOrder = null; } };
}

// Original even-split calculator — no DB changes, no partial payment
// tracking. Waiters use this to hand each guest the amount they owe (in
// ZAR cents, one over-cent absorbed by the last share so the shares sum
// exactly to the total).
function renderEvenSplitPane(totalCents) {
  const pane = document.getElementById('spEvenPane');
  pane.innerHTML = `
    <p style="color:var(--ink-dim);font-size:12.5px;margin:0 0 16px">Enter the number of guests and hand each person their amount.</p>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button id="spMinus" style="width:38px;height:38px;border-radius:10px;background:rgba(245,236,216,.06);color:var(--ink);border:1px solid var(--line);font-size:18px">−</button>
      <input id="spN" type="number" min="1" max="20" value="2" style="flex:1;padding:12px;border-radius:10px;background:rgba(245,236,216,.04);border:1px solid var(--line);color:var(--ink);font-size:20px;text-align:center;font-family:var(--mono)" />
      <button id="spPlus" style="width:38px;height:38px;border-radius:10px;background:rgba(245,236,216,.06);color:var(--ink);border:1px solid var(--line);font-size:18px">+</button>
    </div>
    <div id="spBreakdown" style="padding:14px;border-radius:12px;background:rgba(232,197,138,.08);border:1px solid rgba(232,197,138,.2);min-height:60px"></div>`;
  const inp = document.getElementById('spN');
  const render = () => {
    let n = Math.max(1, Math.min(20, parseInt(inp.value, 10) || 1));
    inp.value = n;
    const share = Math.floor(totalCents / n);
    const remainder = totalCents - share * n;
    const shares = Array(n).fill(share);
    for (let i = 0; i < remainder; i++) shares[i]++;
    const unique = [...new Set(shares)];
    document.getElementById('spBreakdown').innerHTML = unique.length === 1
      ? `<div style="text-align:center"><div style="font-family:var(--mono);font-size:26px;color:var(--accent-2)">R${(share/100).toFixed(2)}</div><div style="font-size:11px;color:var(--ink-dim);margin-top:4px">× ${n} guests</div></div>`
      : `<div style="text-align:center;font-size:13px;color:var(--ink)">
          <b>${remainder}</b> guest${remainder===1?'':'s'} pay <b style="color:var(--accent-2)">R${(shares[0]/100).toFixed(2)}</b>,
          <b>${n-remainder}</b> pay <b style="color:var(--accent-2)">R${(share/100).toFixed(2)}</b>
          <div style="font-size:11px;color:var(--ink-dim);margin-top:6px">Uneven ÷ absorbs the leftover cents.</div>
         </div>`;
  };
  document.getElementById('spMinus').onclick = () => { inp.value = Math.max(1, +inp.value - 1); render(); };
  document.getElementById('spPlus').onclick  = () => { inp.value = Math.min(20, +inp.value + 1); render(); };
  inp.oninput = render;
  render();
}

// Per-item split — assign each order_item to a payer label, live subtotal
// per label, and a "Mark <label> paid" button that PATCHes the assignment
// + payment in one request (see api/_h/staff/orders.js handleSplitPatch).
function renderPerItemPane(order) {
  const pane = document.getElementById('spItemPane');
  const items = order.order_items || [];
  const labelsUsed = [...new Set(items.map(it => it.paid_by).filter(Boolean))];
  const labels = [...new Set([...SPLIT_LABELS.slice(0, Math.max(2, labelsUsed.length)), ...labelsUsed])];

  const subtotals = () => {
    const s = {};
    for (const it of items) if (it.paid_by) s[it.paid_by] = (s[it.paid_by] || 0) + (it.price_cents || 0) * (it.qty || 1);
    return s;
  };

  const draw = () => {
    const s = subtotals();
    pane.innerHTML = `
      <div style="max-height:38vh;overflow:auto;margin-bottom:14px">${items.map(it => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="min-width:0">
            <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.qty}× ${escapeHTML(it.dish_name)}</div>
            <div style="font-size:11px;color:var(--ink-dim)">R${(it.price_cents*it.qty/100).toFixed(2)}${it.paid_at ? ' · <span style="color:var(--ok)">paid</span>' : ''}</div>
          </div>
          <select data-item-label="${it.id}" ${it.paid_at ? 'disabled' : ''} style="padding:8px 10px;border-radius:8px;background:rgba(245,236,216,.05);border:1px solid var(--line);color:var(--ink);min-height:38px">
            <option value="">—</option>
            ${labels.map(l => `<option value="${escapeHTML(l)}" ${it.paid_by === l ? 'selected' : ''}>${escapeHTML(l)}</option>`).join('')}
          </select>
        </div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${labels.filter(l => s[l]).map(l => {
          const allPaid = items.filter(it => it.paid_by === l).every(it => it.paid_at);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(232,197,138,.08);border:1px solid rgba(232,197,138,.2)">
            <span style="font-size:13px">${escapeHTML(l)} <b style="color:var(--accent-2);margin-left:6px">R${(s[l]/100).toFixed(2)}</b></span>
            ${allPaid
              ? `<span style="color:var(--ok);font-size:13px">✅ Paid</span>`
              : `<button data-mark-label="${escapeHTML(l)}" class="btn-ghost" style="padding:7px 12px;min-height:36px;font-size:11px">Mark ${escapeHTML(l)} paid</button>`}
          </div>`;
        }).join('') || '<div style="color:var(--ink-dim);font-size:12px;text-align:center;padding:10px 0">Assign items to a payer to see subtotals.</div>'}
      </div>`;
    pane.querySelectorAll('[data-item-label]').forEach(sel => sel.onchange = async () => {
      try {
        const resp = await api(`/api/staff/orders?id=${order.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ assignments: [{ item_id: sel.dataset.itemLabel, paid_by: sel.value || null }] })
        });
        const it = items.find(i => i.id === sel.dataset.itemLabel);
        if (it) it.paid_by = sel.value || null;
        draw();
      } catch (e) { toast(e.message, 'err'); }
    });
    pane.querySelectorAll('[data-mark-label]').forEach(btn => btn.onclick = async () => {
      try {
        const resp = await api(`/api/staff/orders?id=${order.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ mark_paid: btn.dataset.markLabel })
        });
        const now = new Date().toISOString();
        for (const it of items) if (it.paid_by === btn.dataset.markLabel) it.paid_at = now;
        order.paid_cents = resp.paid_cents;
        draw();
        refresh(); // pulls the authoritative order + paid_cents on the next poll/SSE tick
      } catch (e) { toast(e.message, 'err'); }
    });
  };
  draw();
}

// ============ FLOOR HEATMAP ============
const FLOOR_STALE_MS = 20 * 60 * 1000;
const isBillCall = c => c.type === 'bill' || c.reason === 'bill';
function floorInfo(t) {
  const f = window.__floor || { orders: [], calls: [] };
  const same = x => x.table_label != null && String(x.table_label) === String(t.label);
  const orders = f.orders.filter(same);
  const calls = f.calls.filter(same);
  let state = 'idle';
  if (orders.length) state = 'kitchen';
  const last = orders.reduce((m, o) => Math.max(m, new Date(o.updated_at || o.created_at).getTime() || 0), 0);
  if (orders.length && last && Date.now() - last > FLOOR_STALE_MS) state = 'stale';
  if (calls.some(c => !isBillCall(c))) state = 'call';
  if (calls.some(isBillCall)) state = 'bill';
  return { state, orders, calls };
}
const FLOOR_TXT = { idle: 'Idle', kitchen: 'In kitchen', stale: 'Check in', call: 'Waiter called', bill: 'Bill requested' };
function renderFloor(tables) {
  if (!tables.length) return $('view-floor').innerHTML = `<div class="empty-state" data-icon="🗺"><h3>No tables yet</h3><p>The owner sets these up in the admin console.</p></div>`;
  window.__floorTables = tables;
  $('view-floor').innerHTML = `<div class="flr-legend">
    <span><i style="background:#7dd87d"></i>Idle</span><span><i style="background:#60a5fa"></i>In kitchen</span>
    <span><i style="background:#fbbf24"></i>Waiter called</span><span><i style="background:#f87171"></i>Bill</span>
    <span><i style="background:#a855f7"></i>&gt;20 min quiet</span></div>
    <div class="tables-grid">${tables.map(t => { const i = floorInfo(t); return `
    <div class="flr ${i.state === 'idle' ? '' : i.state}" data-fid="${t.id}">
      <div><div class="lbl">${escapeHTML(t.label)}</div>
      <div class="st">${t.assigned_staff_name ? '👤 ' + escapeHTML(t.assigned_staff_name) : '&nbsp;'}</div></div>
      <div class="st">${FLOOR_TXT[i.state]}</div>
    </div>`; }).join('')}</div>`;
  document.querySelectorAll('[data-fid]').forEach(el => el.onclick = () => openFloorSheet(el.dataset.fid));
}
function openFloorSheet(id) {
  const t = (window.__floorTables || []).find(x => x.id === id); if (!t) return;
  const i = floorInfo(t);
  $('modalBody').innerHTML = `<h3>Table ${escapeHTML(t.label)}</h3>
    <div class="meta" style="margin-bottom:10px">${FLOOR_TXT[i.state]}${t.assigned_staff_name ? ' · 👤 ' + escapeHTML(t.assigned_staff_name) : ''}</div>
    <h4>Open calls</h4>
    ${i.calls.length ? i.calls.map(c => `<div class="opt"><span>${isBillCall(c) ? '💳 Bill' : '🛎 ' + escapeHTML(c.reason || 'help')} · ${new Date(c.created_at).toLocaleTimeString()}</span>
      <span><button class="btn-ok" data-fclose="${c.id}">${isBillCall(c) ? 'Mark bill delivered' : 'Done'}</button></span></div>`).join('') : '<div class="meta">None</div>'}
    <h4 style="margin-top:12px">Recent orders</h4>
    ${i.orders.length ? i.orders.map(o => `<div class="opt"><span>${escapeHTML(o.status)} · ${escapeHTML((o.order_items || []).map(x => (x.qty || x.quantity || 1) + '× ' + (x.name || x.item_name || '')).join(', ') || 'order')}</span><span>${new Date(o.created_at).toLocaleTimeString()}</span></div>`).join('') : '<div class="meta">No active orders</div>'}`;
  $('modal').classList.add('on');
  document.querySelectorAll('[data-fclose]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation(); b.disabled = true;
    try { await api('/api/staff/calls?id=' + b.dataset.fclose, { method: 'PATCH', body: JSON.stringify({ status: 'closed' }) }); $('modal').classList.remove('on'); refresh(); }
    catch (err) { b.disabled = false; toast(err.message, 'err'); }
  });
}
setInterval(() => { if (session && !document.hidden && document.querySelector('.tab.active')?.dataset.tab === 'floor') refresh(); }, 10000);

// ============ WAITLIST (guests queued while the restaurant is full) ============
async function loadWaitlist() {
  let entries = [];
  try { entries = (await api('/api/admin/waitlist')).entries || []; } catch (e) { if (e.message === 'unauth') return; }
  let box = document.getElementById('waitlistSection');
  if (!box) { box = document.createElement('div'); box.id = 'waitlistSection'; $('view-floor').appendChild(box); }
  if (!entries.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<h4 style="margin:16px 0 8px">Waitlist (' + entries.length + ')</h4>' + entries.map(w => {
    const mins = Math.max(0, Math.round((Date.now() - new Date(w.joined_at).getTime()) / 60000));
    return '<div class="opt"><span><b>' + escapeHTML(w.guest_name) + '</b> · party of ' + (w.party_size || 2) + ' · waiting ' + mins + 'm' + (w.notes ? ' · ' + escapeHTML(w.notes) : '') + '</span>'
      + '<span><button class="btn-ok" data-wl-act="seat" data-wl-id="' + escapeHTML(w.id) + '">Seat</button> '
      + '<button data-wl-act="leave" data-wl-id="' + escapeHTML(w.id) + '">No-show</button></span></div>';
  }).join('');
  box.querySelectorAll('[data-wl-act]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api('/api/admin/waitlist?id=' + encodeURIComponent(b.dataset.wlId), { method: 'PATCH', body: JSON.stringify({ action: b.dataset.wlAct }) });
      toast(b.dataset.wlAct === 'seat' ? 'Guest seated' : 'Marked as no-show');
      loadWaitlist();
    } catch (err) { b.disabled = false; toast(err.message, 'err'); }
  });
}

$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('on'); };

// Custom cancellation-reason modal — replaces the native prompt(), which
// pops a system dialog inconsistent with the kiosk UI and is disabled in
// some tablet browsers (silently breaking cancellation).
let _cancelResolve = null;
function promptCancelReason() {
  return new Promise(resolve => {
    _cancelResolve = resolve;
    $('modalBody').innerHTML = `
      <h3>Cancel order</h3>
      <p style="font-size:12.5px;color:var(--ink-dim);margin-bottom:10px">Reason (e.g. guest left, out of stock, staff error)</p>
      <textarea id="cancelReasonInput" autofocus></textarea>
      <div class="row">
        <button class="btn-ghost" id="cancelReasonBack" style="background:rgba(255,239,220,.05);color:var(--ink);border:1px solid var(--line)">Back</button>
        <button class="btn-err" id="cancelReasonOk">Cancel order</button>
      </div>`;
    $('modal').classList.add('on');
    setTimeout(() => $('cancelReasonInput')?.focus(), 0);
    $('cancelReasonBack').onclick = () => finishCancelPrompt(null);
    $('cancelReasonOk').onclick = () => finishCancelPrompt($('cancelReasonInput').value.trim());
  });
}
function promptRecallReason() {
  return new Promise(resolve => {
    _cancelResolve = resolve; // shares Escape handling with the cancel modal
    $('modalBody').innerHTML = `
      <h3>Recall to kitchen</h3>
      <p style="font-size:12.5px;color:var(--ink-dim);margin-bottom:10px">Why is this being recalled? (optional)</p>
      <textarea id="recallReasonInput" maxlength="200"></textarea>
      <div class="row">
        <button class="btn-ghost" id="recallBack" style="background:rgba(255,239,220,.05);color:var(--ink);border:1px solid var(--line)">Cancel</button>
        <button class="btn-primary" id="recallOk">Confirm</button>
      </div>`;
    $('modal').classList.add('on');
    setTimeout(() => $('recallReasonInput')?.focus(), 0);
    $('recallBack').onclick = () => finishCancelPrompt(null);
    $('recallOk').onclick = () => finishCancelPrompt($('recallReasonInput').value.trim().slice(0, 200));
  });
}
function finishCancelPrompt(reason) {
  $('modal').classList.remove('on');
  if (_cancelResolve) { const r = _cancelResolve; _cancelResolve = null; r(reason); }
}
// Escape closes whichever overlay is open (order-cancel modal, table modal, split bill)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const split = document.getElementById('splitOverlay');
  if (split) { split.remove(); return; }
  if ($('modal').classList.contains('on')) {
    if (_cancelResolve) finishCancelPrompt(null);
    else $('modal').classList.remove('on');
  }
});

function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Boot
if (session?.token) onLoggedIn();
// armenu-cmdk.js loads deferred (after this inline script runs), so the
// registerCmdK() call above may no-op on a boot-with-existing-session;
// retry once the deferred scripts have landed.
document.addEventListener('DOMContentLoaded', registerCmdK);
