<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0806" />
<title>Discover restaurants. ARMenu</title>
<meta name="description" content="Every ARMenu restaurant, in one place. Browse menus in AR before you go." />
<meta property="og:title" content="Discover restaurants. ARMenu" />
<meta property="og:description" content="Every ARMenu restaurant, in one place. Browse menus in AR before you go." />
<meta property="og:image" content="https://armenu.co.za/favicon.svg" />
<meta property="og:url" content="https://armenu.co.za/discover" />
<link rel="canonical" href="https://armenu.co.za/discover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0806;--ink:#f5efe6;--ink-dim:#9a9388;--ink-faint:#7a7266;--accent:#d4a574;--accent-2:#e8c58a;--line:rgba(245,236,216,.08);--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  main{max-width:1200px;margin:0 auto;padding:110px 24px 40px}
  .kicker{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
  h1{font-family:var(--serif);font-style:italic;font-size:clamp(38px,7vw,64px);font-weight:400;line-height:1.02;margin-bottom:14px;background:linear-gradient(180deg,#fff,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--ink-dim);font-size:16px;line-height:1.5;max-width:560px;margin-bottom:28px}
  .search{width:100%;max-width:560px;padding:14px 16px;border-radius:12px;background:rgba(245,236,216,.04);border:1px solid var(--line);color:var(--ink);font-size:15px;font-family:inherit}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}
  .chip{padding:8px 14px;border-radius:999px;background:rgba(245,236,216,.04);border:1px solid var(--line);color:var(--ink-dim);font-size:13px;cursor:pointer;font-family:inherit}
  .chip:hover{color:var(--ink)}
  .chip.on{background:rgba(212,165,116,.14);color:var(--accent);border-color:rgba(212,165,116,.28)}
  .chip-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);align-self:center;margin-right:2px}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:rgba(245,236,216,.03);border:1px solid var(--line);transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:rgba(212,165,116,.35)}
  .cover{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#2a1f14,#120d08);background-size:cover;background-position:center}
  .badge-new{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:var(--accent-2);color:#0a0806;font-size:11px;font-weight:700}
  .price{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;background:rgba(10,8,6,.75);color:var(--accent-2);font-family:var(--mono);font-size:12px}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
  .name{font-size:18px;font-weight:700}
  .meta{font-size:13px;color:var(--ink-dim)}
  .pop{align-self:flex-start;padding:5px 10px;border-radius:999px;background:rgba(212,165,116,.12);color:var(--accent);font-size:12px}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-faint);font-family:var(--mono);margin-top:4px}
  .stars{color:var(--accent-2);letter-spacing:1px;font-size:13px}
  .stars .off{color:rgba(245,236,216,.2)}
  .state{text-align:center;padding:60px 20px;color:var(--ink-dim)}
  .state h3{color:var(--ink);font-size:20px;margin-bottom:8px}
  .count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px}
</style>
<script src="/vendor/armenu-errorbar.js" defer></script>
<script src="/vendor/armenu-sounds.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-a11y.css">
<script src="/vendor/sentry-client.js" defer></script>
<script src="/vendor/cookie-consent.js" defer></script>
</head>
<body>
<div id="mkNav"></div>

<main>
  <div class="kicker">Discover</div>
  <h1>Every ARMenu restaurant, in one place.</h1>
  <p class="lead">Browse menus in AR before you go.</p>

  <input id="q" class="search" type="search" placeholder="Search restaurants, dishes, cuisines, cities" aria-label="Search restaurants" autocomplete="off" />
  <div class="chips" id="chips" role="group" aria-label="Filters"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="grid" id="grid">
    <div class="sk-card" style="border-radius:14px;height:180px"></div>
    <div class="sk-card" style="border-radius:14px;height:180px"></div>
    <div class="sk-card" style="border-radius:14px;height:180px"></div>
  </div>
  <div class="state" id="state" style="display:none"></div>
</main>

<div id="mkFooter"></div>

<script>
(function () {
  var all = [], q = '', city = '', cuisine = '';
  var $ = function (id) { return document.getElementById(id); };
  var state = $('state'), grid = $('grid');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function stars(r) {
    if (r == null) return '<span>Not yet rated</span>';
    var full = Math.round(r), out = '';
    for (var i = 1; i <= 5; i++) out += i <= full ? '★' : '<span class="off">★</span>';
    return '<span class="stars" title="' + r.toFixed(1) + ' out of 5">' + out + '</span>';
  }
  function cardHtml(r) {
    var cover = safeUrl(r.cover_image_url);
    var style = cover ? ' style="background-image:url(&quot;' + esc(encodeURI(cover)) + '&quot;)"' : '';
    var sub = [r.cuisine, r.city].filter(Boolean).map(esc).join(' · ');
    return '<a class="card" href="/m/' + encodeURIComponent(r.slug) + '">' +
      '<div class="cover"' + style + '>' +
        (r.is_new ? '<span class="badge-new">🆕 New</span>' : '') +
        (r.price_range ? '<span class="price">' + esc(r.price_range) + '</span>' : '') +
      '</div><div class="body">' +
        '<div class="name">' + esc(r.name) + '</div>' +
        (sub ? '<div class="meta">' + sub + '</div>' : '') +
        (r.popular_dish ? '<span class="pop">Popular: ' + esc(r.popular_dish.name) + '</span>' : '') +
        '<div class="foot"><span>' + r.dish_count + ' dish' + (r.dish_count === 1 ? '' : 'es') + '</span>' + stars(r.avg_rating) + '</div>' +
      '</div></a>';
  }
  function matches(r) {
    if (city && r.city !== city) return false;
    if (cuisine && r.cuisine !== cuisine) return false;
    if (!q) return true;
    var hay = [r.name, r.cuisine, r.city, r.popular_dish && r.popular_dish.name].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function render() {
    var list = all.filter(matches);
    $('count').textContent = list.length + ' restaurant' + (list.length === 1 ? '' : 's');
    grid.innerHTML = list.map(cardHtml).join('');
    if (!list.length) {
      state.style.display = '';
      state.innerHTML = '<div class="empty-state" data-icon="🔍"><h3>No restaurants found</h3><p>Try a different search or clear the filters.</p></div>';
    } else state.style.display = 'none';
  }
  function uniq(k) {
    var seen = {}, out = [];
    all.forEach(function (r) { if (r[k] && !seen[r[k]]) { seen[r[k]] = 1; out.push(r[k]); } });
    return out.sort();
  }
  function chipGroup(label, values, current) {
    if (!values.length) return '';
    return '<span class="chip-label">' + label + '</span>' +
      values.map(function (v) {
        return '<button type="button" class="chip' + (v === current ? ' on' : '') + '" data-k="' + label + '" data-v="' + esc(v) + '" aria-pressed="' + (v === current) + '">' + esc(v) + '</button>';
      }).join('');
  }
  function renderChips() {
    $('chips').innerHTML = chipGroup('City', uniq('city'), city) + chipGroup('Cuisine', uniq('cuisine'), cuisine);
  }
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var v = b.getAttribute('data-v');
    if (b.getAttribute('data-k') === 'City') city = city === v ? '' : v;
    else cuisine = cuisine === v ? '' : v;
    renderChips(); render();
  });
  $('q').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); render(); });

  fetch('/api/discover').then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (d) {
    all = Array.isArray(d.restaurants) ? d.restaurants : [];
    renderChips(); render();
  }).catch(function () {
    $('count').textContent = '';
    state.style.display = '';
    state.innerHTML = '<div class="empty-state" data-icon="⚠️"><h3>Could not load restaurants</h3><p>Please refresh in a moment.</p></div>';
  });
})();
</script>
<script src="/vendor/marketing-chrome.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-fx.css">
<script defer src="/vendor/armenu-fx.js"></script>
<script defer src="/vendor/armenu-cmdk.js"></script>
<script>
(function () {
  var seen = {}, re = /^\/(m\/|(how|why|faq|plans|contact|legal|discover)$)/;
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.origin !== location.origin) return;
    var p = a.pathname;
    if (!re.test(p) || seen[p]) return;
    seen[p] = 1;
    var l = document.createElement('link');
    l.rel = 'prefetch'; l.href = p;
    document.head.appendChild(l);
  }, true);
})();
</script>
</body>
</html>
