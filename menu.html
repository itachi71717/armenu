<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0806" />
<title>Menu. AR Menu</title>
<meta name="description" content="Browse this restaurant's menu and see every dish in augmented reality on your table." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0806;--ink:#f5efe6;--ink-dim:#9a9388;--ink-faint:#564f45;
    --accent:#ff5722;--accent-2:#ffb066;--line:rgba(255,239,220,.08);
    --serif:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace;
  }
  html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
  ::selection{background:var(--accent);color:#0a0806}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  header{
    position:sticky;top:0;z-index:20;
    background:rgba(10,8,6,.85);backdrop-filter:blur(18px) saturate(1.4);
    border-bottom:1px solid var(--line);
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .brand .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;box-shadow:0 4px 12px rgba(255,87,34,.4),inset 0 1px 0 rgba(255,255,255,.3)}
  .brand .mark::after{content:"";position:absolute;inset:5px;border-radius:3px;background:#0a0806;box-shadow:inset 0 0 0 2px rgba(255,87,34,.6)}
  .brand b{font-weight:800}.brand i{font-style:normal;color:var(--ink-dim);font-weight:500;margin-left:3px}
  .header-right{display:flex;align-items:center;gap:8px}
  .lang-btn,.venue-pill{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;background:rgba(255,239,220,.06);border:1px solid var(--line);
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .cover{
    aspect-ratio:16/9;max-height:200px;background:#1a1410 center/cover no-repeat;
    border-bottom:1px solid var(--line);position:relative;
  }
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg) 100%)}

  .hero{text-align:center;padding:36px 24px 22px;background:radial-gradient(ellipse 120% 80% at 50% 0%,rgba(255,87,34,.12),transparent 60%)}
  .hero .pre{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
  .hero h1{
    font-family:var(--serif);font-style:italic;font-size:clamp(34px,8vw,52px);
    font-weight:400;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(180deg,#fff 0%,var(--accent-2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{color:var(--ink-dim);font-size:14px;margin-top:14px;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.5}
  .hero .sub em{font-family:var(--serif);font-style:italic;color:var(--accent-2)}
  .hero .table-tag{margin-top:14px;display:inline-block;padding:5px 11px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent-2);border:1px solid rgba(255,176,102,.3);border-radius:999px;background:rgba(255,176,102,.06)}

  .category-nav{
    position:sticky;top:52px;z-index:15;background:rgba(10,8,6,.9);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:10px 12px;overflow-x:auto;display:flex;gap:6px;
    scrollbar-width:none;
  }
  .category-nav::-webkit-scrollbar{display:none}
  .cat-chip{
    flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;
    background:rgba(255,239,220,.04);border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap;
  }
  .cat-chip.active{background:rgba(255,87,34,.14);color:var(--accent);border-color:rgba(255,87,34,.3)}

  main{max-width:720px;margin:0 auto;padding:14px 16px}
  .section-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-faint);margin:24px 6px 14px;display:flex;align-items:center;gap:12px}
  .section-label::before,.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

  .dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .dish{
    border-radius:18px;border:1px solid var(--line);overflow:hidden;
    background:linear-gradient(180deg,rgba(255,239,220,.025),rgba(255,239,220,.005));
    display:flex;flex-direction:column;transition:border-color .2s,transform .2s;
    -webkit-tap-highlight-color:transparent;position:relative;
  }
  .dish:hover{border-color:rgba(255,87,34,.3)}
  .dish .thumb{aspect-ratio:4/3;background:#1a1410 center/cover no-repeat;position:relative;display:grid;place-items:center}
  .dish .thumb-fallback{font-family:var(--serif);font-style:italic;font-size:48px;color:var(--ink-faint)}
  .dish .ar-tag{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;font-family:var(--mono);font-size:10px;font-weight:600;background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 12px rgba(255,87,34,.4)}
  .dish .info{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .dish .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .dish .name{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.2}
  .dish .price{color:var(--accent);font-size:14px;font-weight:700;white-space:nowrap}
  .dish .desc{font-size:12px;color:var(--ink-dim);line-height:1.35;min-height:1.2em}
  .dish .row{display:flex;gap:6px;margin-top:8px}
  .dish .row button{flex:1;padding:9px 10px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .dish .btn-ar{background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff;box-shadow:0 4px 12px rgba(255,87,34,.3)}
  .dish .btn-add{background:rgba(255,239,220,.06);color:var(--ink);border:1px solid var(--line)}
  .dish .btn-add:active{transform:scale(.97)}

  /* Bottom action bar (waiter call + cart) */
  .actionbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(10,8,6,.95);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;
  }
  .actionbar button{
    flex:1;padding:14px 16px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.03em;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff;box-shadow:0 6px 18px rgba(255,87,34,.3)}
  .btn-secondary{background:rgba(255,239,220,.06);color:var(--ink);border:1px solid var(--line)}
  .cart-count{background:#fff;color:var(--accent);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}

  /* Sheet (cart / review / waiter reason) */
  .sheet-overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none}
  .sheet-overlay.on{display:block}
  .sheet{
    position:fixed;bottom:0;left:0;right:0;z-index:41;
    background:#13100c;border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  }
  .sheet.on{transform:translateY(0)}
  .sheet .grip{width:44px;height:4px;border-radius:2px;background:rgba(255,239,220,.15);margin:0 auto 16px}
  .sheet h3{font-family:var(--serif);font-style:italic;font-size:24px;font-weight:400;margin-bottom:6px}
  .sheet .sh-sub{color:var(--ink-dim);font-size:13px;margin-bottom:16px}
  .sheet .cart-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sheet .cart-name{flex:1;font-weight:600;font-size:14px}
  .sheet .qty{display:flex;align-items:center;gap:8px}
  .sheet .qty button{width:26px;height:26px;border-radius:8px;background:rgba(255,239,220,.06);border:1px solid var(--line);font-size:14px;font-weight:700}
  .sheet .qty span{min-width:22px;text-align:center;font-weight:600}
  .sheet .cart-total{display:flex;justify-content:space-between;padding:16px 0;font-weight:700;font-size:16px}
  .sheet .field{margin:12px 0}
  .sheet label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:6px}
  .sheet input,.sheet textarea,.sheet select{width:100%;padding:12px;border-radius:10px;background:rgba(255,239,220,.03);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px}
  .sheet .submit{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff;font-weight:700;font-size:14px;margin-top:12px}
  .sheet .reason-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sheet .reason-row button{padding:14px;border-radius:12px;background:rgba(255,239,220,.05);border:1px solid var(--line);font-weight:600}
  .sheet .stars{display:flex;justify-content:center;gap:8px;padding:14px 0}
  .sheet .stars button{font-size:36px;color:#3a342d;background:none;border:none;transition:color .15s}
  .sheet .stars button.on{color:var(--accent-2)}

  .state{padding:80px 24px;text-align:center;color:var(--ink-dim)}
  .state h2{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--ink);margin-bottom:8px;font-weight:400}
  .state p{font-size:14px;max-width:340px;margin:0 auto}
  .spinner{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,239,220,.08);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#13100c;border:1px solid var(--line);font-size:13px;z-index:100;display:none;box-shadow:0 12px 32px rgba(0,0,0,.6)}
  .toast.show{display:block;animation:fadein .25s ease}
  .toast.err{border-color:rgba(248,113,113,.3);color:#f87171}
  .toast.ok{border-color:rgba(125,216,125,.3);color:#7dd87d}
  @keyframes fadein{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

  .foot-hint{text-align:center;padding:32px 24px 0;color:var(--ink-faint);font-size:12px;line-height:1.6}
  .foot-hint em{font-family:var(--serif);font-style:italic;color:var(--ink-dim);font-size:13px}
  .foot-hint .powered{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .foot-hint .powered a{color:var(--accent-2)}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark"></span><b>AR</b><i>Menu</i></div>
  <div class="header-right">
    <button class="lang-btn" id="langBtn" style="display:none">EN</button>
    <div class="venue-pill" id="navVenue">Loading…</div>
  </div>
</header>

<div id="content">
  <div class="state"><div class="spinner"></div><p>Loading the menu…</p></div>
</div>

<!-- Bottom action bar: shown only when at least one action is enabled -->
<div class="actionbar" id="actionbar" style="display:none">
  <button class="btn-secondary" id="waiterBtn" style="display:none">🛎 Call Waiter</button>
  <button class="btn-primary" id="cartBtn" style="display:none">Order <span class="cart-count" id="cartCount">0</span></button>
  <button class="btn-secondary" id="reviewBtn" style="display:none">★ Review</button>
</div>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const r = params.get('r');
const table = params.get('t') || null;    // ?t=T-12  pinning the QR to a table
const $ = id => document.getElementById(id);

const state = {
  settings: null,
  menu: null,
  categories: [],
  activeCategory: null,
  cart: [],    // [{slug,name,qty,price_cents,note?}]
  lang: 'en'
};

function toast(msg, kind='ok') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + kind;
  setTimeout(() => t.classList.remove('show'), 2600);
}

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtPrice(cents, sym) {
  if (!cents && cents !== 0) return '';
  const v = (cents / 100).toFixed(2);
  return `${sym || 'R'}${v}`;
}

function showError(title, sub) {
  $('content').innerHTML = `<div class="state"><h2>${title}</h2><p>${sub}</p></div>`;
}

async function boot() {
  if (!r) return showError('No restaurant specified.', 'Add ?r=restaurant-slug to the URL.');
  try {
    const [settingsRes, menuRes] = await Promise.all([
      fetch(`/api/settings?r=${encodeURIComponent(r)}`),
      fetch(`/api/dish?r=${encodeURIComponent(r)}`)
    ]);
    if (!menuRes.ok) {
      const d = await menuRes.json().catch(() => ({}));
      return showError('Restaurant not found.', d.error || 'Check the QR with the restaurant.');
    }
    state.settings = settingsRes.ok ? await settingsRes.json() : { features:{}, branding:{}, locale:{currency:'ZAR',currency_symbol:'R',languages:['en'],default_lang:'en'} };
    state.menu = await menuRes.json();
    state.lang = state.settings.locale.default_lang || 'en';
    applyBranding();
    render();
    wireActions();
  } catch (e) {
    showError('Could not load menu.', 'Check your internet and try again.');
  }
}

function applyBranding() {
  const b = state.settings.branding || {};
  if (b.primary) document.documentElement.style.setProperty('--accent', b.primary);
  if (b.bg) document.documentElement.style.setProperty('--bg', b.bg);
}

function render() {
  const { restaurant, dishes } = state.menu;
  const settings = state.settings;
  const langs = settings.locale.languages || ['en'];

  document.title = `${restaurant.name} · Menu`;
  $('navVenue').textContent = restaurant.name;

  if (langs.length > 1) {
    $('langBtn').style.display = 'inline-block';
    $('langBtn').textContent = state.lang.toUpperCase();
  }

  // Group dishes by category (from the payload if present)
  const cats = {};
  for (const d of (dishes || [])) {
    const key = d.category || 'menu';
    if (!cats[key]) cats[key] = { key, name: d.category_name || 'Menu', items: [] };
    cats[key].items.push(d);
  }
  state.categories = Object.values(cats);
  if (!state.activeCategory && state.categories[0]) state.activeCategory = state.categories[0].key;

  const cover = settings.branding.cover
    ? `<div class="cover" style="background-image:url('${settings.branding.cover}')"></div>` : '';

  const chipsHtml = state.categories.length > 1 ? `<nav class="category-nav">${state.categories.map(c => `
      <button class="cat-chip ${c.key === state.activeCategory ? 'active' : ''}" data-cat="${escapeHTML(c.key)}">${escapeHTML(c.name)}</button>`).join('')}</nav>` : '';

  const heroSub = settings.branding.tagline
    ? escapeHTML(settings.branding.tagline)
    : `Tap any dish to see it <em>life-size on your table</em>.`;

  const tableTag = table ? `<div class="table-tag">Table · ${escapeHTML(table)}</div>` : '';

  if (!dishes.length) {
    $('content').innerHTML = `${cover}<section class="hero"><div class="pre">AR Menu</div><h1>${escapeHTML(restaurant.name)}</h1><p class="sub">No dishes are live yet. <em>Check back soon.</em></p></section>`;
    return;
  }

  const activeItems = state.categories.find(c => c.key === state.activeCategory)?.items || dishes;
  const dishesHtml = activeItems.map(d => renderDish(d)).join('');

  $('content').innerHTML = `
    ${cover}
    <section class="hero">
      <div class="pre">AR Menu</div>
      <h1>${escapeHTML(restaurant.name)}</h1>
      <p class="sub">${heroSub}</p>
      ${tableTag}
    </section>
    ${chipsHtml}
    <main>
      <div class="section-label">Menu · ${activeItems.length} dish${activeItems.length === 1 ? '' : 'es'}</div>
      <div class="dishes">${dishesHtml}</div>
      <div class="foot-hint">
        Point your phone at the table after tapping <em>View in AR</em>. your meal appears at real size.
        <div class="powered">Powered by <a href="https://armenu.co.za" target="_blank" rel="noopener">AR Menu</a></div>
      </div>
    </main>`;

  // Wire chips
  document.querySelectorAll('.cat-chip').forEach(el => el.addEventListener('click', () => {
    state.activeCategory = el.dataset.cat; render(); updateActionbar();
  }));

  // Wire dish buttons
  document.querySelectorAll('[data-add]').forEach(el => el.addEventListener('click', () => addToCart(el.dataset.add)));

  updateActionbar();
}

function renderDish(d) {
  const sym = state.settings.locale.currency_symbol || 'R';
  const price = d.price_cents ? fmtPrice(d.price_cents, sym) : (d.price || '');
  const nameTr = d.translations?.[state.lang]?.name || d.name;
  const descTr = d.translations?.[state.lang]?.description || d.description || '';
  const showOrder = state.settings.features.orders;

  return `
    <div class="dish">
      <a href="/view.html?r=${encodeURIComponent(r)}&d=${encodeURIComponent(d.slug)}${table ? '&t=' + encodeURIComponent(table) : ''}" class="thumb-link">
        <div class="thumb" ${d.thumb ? `style="background-image:url('${d.thumb}')"` : ''}>
          ${d.thumb ? '' : `<span class="thumb-fallback">${escapeHTML(nameTr[0] || '?')}</span>`}
          <span class="ar-tag">View in AR</span>
        </div>
      </a>
      <div class="info">
        <div class="top-row">
          <div class="name">${escapeHTML(nameTr)}</div>
          ${price ? `<div class="price">${escapeHTML(price)}</div>` : ''}
        </div>
        ${descTr ? `<div class="desc">${escapeHTML(descTr)}</div>` : ''}
        <div class="row">
          <a class="btn-ar" href="/view.html?r=${encodeURIComponent(r)}&d=${encodeURIComponent(d.slug)}${table ? '&t=' + encodeURIComponent(table) : ''}" style="display:flex;align-items:center;justify-content:center;text-decoration:none">See in AR →</a>
          ${showOrder ? `<button class="btn-add" data-add="${escapeHTML(d.slug)}">+ Add</button>` : ''}
        </div>
      </div>
    </div>`;
}

function updateActionbar() {
  const f = state.settings.features;
  const bar = $('actionbar');
  const any = f.orders || f.waiter_call || f.reviews;
  bar.style.display = any ? 'flex' : 'none';
  $('waiterBtn').style.display  = f.waiter_call ? 'flex' : 'none';
  $('cartBtn').style.display    = f.orders ? 'flex' : 'none';
  $('reviewBtn').style.display  = f.reviews ? 'flex' : 'none';
  $('cartCount').textContent = state.cart.reduce((s, i) => s + i.qty, 0);
}

function addToCart(slug) {
  const dish = state.menu.dishes.find(d => d.slug === slug);
  if (!dish) return;
  const existing = state.cart.find(i => i.slug === slug);
  if (existing) existing.qty++;
  else state.cart.push({ slug, name: dish.name, qty: 1, price_cents: dish.price_cents || 0 });
  updateActionbar();
  toast(`Added ${dish.name}`, 'ok');
}

// ============ SHEETS ============
function openSheet(html) {
  $('sheetBody').innerHTML = html;
  $('overlay').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet() {
  $('overlay').classList.remove('on');
  $('sheet').classList.remove('on');
}
$('overlay').addEventListener('click', closeSheet);

function openCart() {
  if (!state.cart.length) return toast('Your cart is empty', 'err');
  const sym = state.settings.locale.currency_symbol || 'R';
  const total = state.cart.reduce((s, i) => s + i.price_cents * i.qty, 0);
  const rows = state.cart.map((it, i) => `
    <div class="cart-row">
      <div class="cart-name">${escapeHTML(it.name)}<br><span style="font-size:12px;color:var(--ink-dim)">${fmtPrice(it.price_cents, sym) || ''}</span></div>
      <div class="qty">
        <button data-dec="${i}">−</button><span>${it.qty}</span><button data-inc="${i}">+</button>
      </div>
    </div>`).join('');
  openSheet(`
    <h3>Your order</h3>
    <div class="sh-sub">Sent straight to the kitchen when you confirm.</div>
    ${rows}
    <div class="cart-total"><span>Total</span><span>${fmtPrice(total, sym)}</span></div>
    <div class="field"><label>Note for the kitchen (optional)</label><textarea id="orderNote" rows="2" placeholder="Allergies, spice level, etc."></textarea></div>
    ${!table ? '<div class="field"><label>Your table number (optional)</label><input id="orderTable" placeholder="e.g. 12" /></div>' : ''}
    <button class="submit" id="orderSend">Send to kitchen →</button>
  `);
  document.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { state.cart[b.dataset.inc].qty++; openCart(); updateActionbar(); });
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
    const i = +b.dataset.dec; state.cart[i].qty--;
    if (state.cart[i].qty <= 0) state.cart.splice(i, 1);
    if (!state.cart.length) { closeSheet(); updateActionbar(); return; }
    openCart(); updateActionbar();
  });
  $('orderSend').onclick = submitOrder;
}

async function submitOrder() {
  const btn = $('orderSend'); btn.disabled = true; btn.textContent = 'Sending…';
  const note = $('orderNote')?.value.trim() || undefined;
  const tbl = table || $('orderTable')?.value.trim() || undefined;
  try {
    const res = await fetch('/api/order', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ r, table: tbl, note, items: state.cart.map(i => ({ dish_slug: i.slug, qty: i.qty })) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not send');
    state.cart = []; updateActionbar(); closeSheet();
    toast('Order sent. kitchen has it ✓', 'ok');
  } catch (e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = 'Send to kitchen →'; }
}

function openWaiter() {
  openSheet(`
    <h3>Call the waiter</h3>
    <div class="sh-sub">A staff member will come to your table.</div>
    ${!table ? '<div class="field"><label>Your table number</label><input id="callTable" placeholder="e.g. 12" /></div>' : `<div class="table-tag" style="margin:8px 0 12px">Table · ${escapeHTML(table)}</div>`}
    <div class="reason-row">
      <button data-reason="help">👋 General</button>
      <button data-reason="water">💧 Water</button>
      <button data-reason="bill">💳 The bill</button>
      <button data-reason="other">✎ Other</button>
    </div>
  `);
  document.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => sendCall(b.dataset.reason));
}

async function sendCall(reason) {
  const tbl = table || $('callTable')?.value.trim() || undefined;
  try {
    const res = await fetch('/api/waiter-call', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ r, table: tbl, reason })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Could not send');
    closeSheet();
    toast('Waiter on the way ✓', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function openReview() {
  openSheet(`
    <h3>How was it?</h3>
    <div class="sh-sub">One tap. It really helps.</div>
    <div class="stars" id="stars">
      ${[1,2,3,4,5].map(n => `<button data-star="${n}">★</button>`).join('')}
    </div>
    <div class="field"><label>Comment (optional)</label><textarea id="revComment" rows="3" placeholder="Tell us more…"></textarea></div>
    <button class="submit" id="revSend" disabled>Send review →</button>
  `);
  let picked = 0;
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    picked = +b.dataset.star;
    document.querySelectorAll('[data-star]').forEach(x => x.classList.toggle('on', +x.dataset.star <= picked));
    $('revSend').disabled = false;
  });
  $('revSend').onclick = async () => {
    if (!picked) return;
    try {
      const res = await fetch('/api/review', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ r, stars: picked, comment: $('revComment').value.trim() || undefined, table })
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Could not send');
      closeSheet();
      if (d.google_review_url) {
        setTimeout(() => {
          if (confirm(`Thanks! Would you share your ${picked}-star review on Google too? It helps this restaurant enormously.`)) {
            window.open(d.google_review_url, '_blank', 'noopener');
          }
        }, 200);
      }
      toast('Thanks for your review ✓', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
}

function wireActions() {
  $('cartBtn').onclick   = openCart;
  $('waiterBtn').onclick = openWaiter;
  $('reviewBtn').onclick = openReview;

  const langs = state.settings.locale.languages || ['en'];
  $('langBtn').onclick = () => {
    const i = langs.indexOf(state.lang);
    state.lang = langs[(i + 1) % langs.length];
    $('langBtn').textContent = state.lang.toUpperCase();
    render();
  };
}

boot();
</script>
</body>
</html>
