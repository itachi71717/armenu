      apple.rel = 'apple-touch-icon';
      apple.href = b.logo;
      document.head.appendChild(apple);
      // Dynamic manifest so PWA install prompt uses the restaurant's name + logo
      const rname = state.settings.restaurant?.name || 'Menu';
      const rslug = state.settings.restaurant?.slug || '';
      const dyn = {
        name: rname,
        short_name: rname.length > 12 ? rname.slice(0, 12) : rname,
        start_url: rslug ? `/m/${rslug}` : '/',
        display: 'standalone',
        background_color: b.bg || '#0a0806',
        theme_color: primary,
        icons: [{ src: b.logo, sizes: 'any', type: b.logo.endsWith('.svg') ? 'image/svg+xml' : 'image/png', purpose: 'any' }]
      };
      const blob = new Blob([JSON.stringify(dyn)], { type: 'application/manifest+json' });
      const url = URL.createObjectURL(blob);
      const mfLink = document.querySelector('link[rel="manifest"]') || (() => { const l = document.createElement('link'); l.rel = 'manifest'; document.head.appendChild(l); return l; })();
      mfLink.href = url;
    } catch {}
  }
  // Update the page title to the restaurant's name so browser tabs read right
  if (state.settings.restaurant?.name) {
    try { document.title = state.settings.restaurant.name + ' · Menu'; } catch {}
  }
}

function render() {
  const { restaurant, dishes } = state.menu;
  const settings = state.settings;
  const langs = settings.locale.languages || ['en'];

  document.title = `${restaurant.name} · Menu`;
  $('navVenue').textContent = restaurant.name;

  // Detect which languages actually have any translated dishes — even if the
  // restaurant hasn't formally listed them in settings.locale.languages, expose
  // the switcher so the manager's work isn't invisible.
  const availableLangs = new Set(['en']);
  for (const d of (dishes || [])) {
    if (d.translations && typeof d.translations === 'object') {
      for (const k of Object.keys(d.translations)) if (d.translations[k]?.name || d.translations[k]?.description) availableLangs.add(k);
    }
  }
  for (const l of langs) availableLangs.add(l);
  const langList = [...availableLangs];
  if (langList.length > 1) {
    const btn = $('langBtn');
    btn.style.display = 'inline-block';
    btn.textContent = state.lang.toUpperCase();
    btn.onclick = () => {
      const i = langList.indexOf(state.lang);
      state.lang = langList[(i + 1) % langList.length];
      btn.textContent = state.lang.toUpperCase();
      try { localStorage.setItem('armenu_lang_' + r, state.lang); localStorage.setItem('armenu_lang_manual', '1'); } catch {}
      render();
    };
    // Load saved language preference
    let _langSaved = null, _langManual = null;
    try { _langSaved = localStorage.getItem('armenu_lang_' + r); _langManual = localStorage.getItem('armenu_lang_manual'); } catch {}
    if (_langSaved && langList.includes(_langSaved)) state.lang = _langSaved;
    else if (!_langManual && !state._langAutoDone) {
      // Auto-detect from browser language (primary tag) when dishes carry that translation
      state._langAutoDone = true;
      const primary = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().split(/[-_]/)[0];
      if (primary && primary !== 'en' && (dishes || []).some(d => d.translations && d.translations[primary] && (d.translations[primary].name || d.translations[primary].description))) state.lang = primary;
    }
    btn.textContent = state.lang.toUpperCase();
  }
  // Currency toggle — only shown if the restaurant charges in ZAR (so tourists get a peek)
  const baseCcy = settings.locale.currency || 'ZAR';
  if (baseCcy === 'ZAR') {
    const btn = $('currencyBtn');
    btn.style.display = 'inline-block';
    btn.textContent = _displayCcy;
    btn.onclick = () => {
      const order = ['ZAR', 'USD', 'EUR', 'GBP', 'AUD'];
      _displayCcy = order[(order.indexOf(_displayCcy) + 1) % order.length];
      try { localStorage.setItem('armenu_display_ccy', _displayCcy); } catch {}
      btn.textContent = _displayCcy;
      render();
      if (_displayCcy !== 'ZAR') toast(`Prices shown in ${_displayCcy} — you'll still be charged in ZAR`, 'ok');
    };
  }

  // Group dishes by category (from the payload if present)
  const cats = {};
  for (const d of (dishes || [])) {
    const key = d.category || 'menu';
    if (!cats[key]) cats[key] = { key, name: d.category_name || 'Menu', items: [] };
    cats[key].items.push(d);
  }
  state.categories = Object.values(cats);
  if (!state.activeCategory && state.categories[0]) state.activeCategory = state.categories[0].key;

  const cover = settings.branding.cover
    ? `<div class="cover has-image" style="background-image:url('${settings.branding.cover}')"></div>` : '';

  const chipsHtml = state.categories.length > 1 ? `<nav class="category-nav">${state.categories.map(c => `
      <button class="cat-chip ${c.key === state.activeCategory ? 'active' : ''}" data-cat="${escapeHTML(c.key)}">${escapeHTML(c.name)}</button>`).join('')}</nav>` : '';

  const heroSub = settings.branding.tagline
    ? escapeHTML(settings.branding.tagline)
    : ui('heroSub');

  const tableTag = table ? `<div class="table-tag">Table · ${escapeHTML(table)}</div>` : '';
  const fxNote = (baseCcy === 'ZAR' && _displayCcy !== 'ZAR')
    ? `<div class="table-tag" style="border-color:rgba(255,176,102,.2);color:var(--ink-faint);background:transparent">≈ approx. ${escapeHTML(_displayCcy)}, charged in ${escapeHTML(baseCcy)}</div>`
    : '';
  const brandBadge = settings.branding.tagline
    ? `<div class="brand-badge">${escapeHTML(settings.branding.tagline)}</div>`
    : `<div class="brand-badge">Powered by <b>ARMenu</b></div>`;

  if (!dishes.length) {
    const skel = $('actionbarSkeleton'); if (skel) skel.style.display = 'none';
    $('content').innerHTML = `${cover}<section class="hero"><div class="pre">ARMenu</div><h1>${escapeHTML(restaurant.name)}</h1></section>
      <main><div class="empty-state" data-icon="🍽"><h3>No dishes are live yet</h3><p>Check back soon.</p></div></main>`;
    return;
  }

  // Client-side search + dietary filtering (a dish must satisfy ALL active filters)
  const q = (state.searchQuery || '').trim().toLowerCase();
  const filtersActive = !!q || state.dietFilters.size > 0;
  const activeDiets = [...state.dietFilters];
  const dishVisible = d => dishMatchesSearch(d, q) && activeDiets.every(k => dishMatchesDiet(d, k)) && (!veganMode || isVeganDish(d));
  const matchTotal = dishes.filter(dishVisible).length;
  syncVeganUi(matchTotal);
  const collapsible = state.categories.length >= 4;
  let activeItems = (state.categories.find(c => c.key === state.activeCategory)?.items || dishes).filter(dishVisible);
  const countEl = $('menuFilterCount');
  if (countEl) {
    countEl.style.display = filtersActive ? '' : 'none';
    countEl.textContent = `${matchTotal} of ${dishes.length} dishes visible`;
  }
  const noMatchHtml = '<div class="empty-state" data-icon="🔍"><h3>No dishes match</h3><p>Try removing a filter or changing your search.</p></div>';
  let menuBodyHtml, menuCount;
  if (collapsible) {
    // 4+ categories: every category is a <details>; first two open by default,
    // collapse state remembered per restaurant in sessionStorage. While a
    // search/filter is active, sections with matches are forced open.
    const saved = catOpenMap();
    let idx = 0;
    menuBodyHtml = state.categories.map((c, ci) => {
      const items = c.items.filter(dishVisible);
      if (!items.length) return '';
      const open = filtersActive ? true : (saved[c.key] !== undefined ? saved[c.key] : ci < 2);
      const html = items.map(d => renderDish(d, idx++)).join('');
      return `<details class="cat-section" data-cat-section="${escapeHTML(c.key)}" id="cat-sec-${ci}"${open ? ' open' : ''}>
        <summary>${escapeHTML(c.name)}<span class="cat-n">${items.length}</span></summary>
        <div class="dishes">${html}</div></details>`;
    }).join('') || noMatchHtml;
    menuCount = matchTotal;
  } else {
    menuBodyHtml = activeItems.length ? `<div class="dishes">${activeItems.map((d, i) => renderDish(d, i)).join('')}</div>` : noMatchHtml;
    menuCount = activeItems.length;
  }

  $('content').innerHTML = `
    ${cover}
    <section class="hero">
      <div class="pre">ARMenu</div>
      <h1>${escapeHTML(restaurant.name)}</h1>
      <p class="sub">${heroSub}</p>
      ${tableTag}
      ${fxNote}
      ${brandBadge}
    </section>
    ${filtersActive ? '' : renderCombos()}
    ${chipsHtml}
    <main>
      <div class="section-label">Menu · ${menuCount} dish${menuCount === 1 ? '' : 'es'}</div>
      ${menuBodyHtml}
      <div id="recsSlot"></div>
      <div class="foot-hint">
        ${ui('footHint')}
        <div class="powered">${ui('poweredBy')} <a href="https://armenu.co.za" target="_blank" rel="noopener">ARMenu</a></div>
      </div>
    </main>`;

  // Wire chips
  document.querySelectorAll('.cat-chip').forEach(el => el.addEventListener('click', () => {
    state.activeCategory = el.dataset.cat;
    if (!collapsible) { render(); updateActionbar(); return; }
    // Collapsible layout: highlight the chip, open the section if collapsed, jump to it.
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c === el));
    const sec = [...document.querySelectorAll('details.cat-section')].find(d => d.dataset.catSection === el.dataset.cat);
    if (!sec) { toast('No dishes match your filters in this category', 'ok'); return; }
    if (!sec.open) { sec.open = true; if (!filtersActive) saveCatOpen(el.dataset.cat, true); }
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  document.querySelectorAll('details.cat-section').forEach(det => det.addEventListener('toggle', () => {
    if (!filtersActive) saveCatOpen(det.dataset.catSection, det.open);
  }));
  // Wire compare toggles
  document.querySelectorAll('[data-cmp]').forEach(el => el.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    toggleCompare(el.dataset.cmp);
  }));
  updateCompareUi();

  // Wire dish buttons
  document.querySelectorAll('[data-add]').forEach(el => el.addEventListener('click', () => addToCart(el.dataset.add)));
  document.querySelectorAll('[data-add-combo]').forEach(el => el.addEventListener('click', () => addComboToCart(el.dataset.addCombo)));
  // Wire heart buttons — never navigates the enclosing thumb link
  document.querySelectorAll('[data-heart]').forEach(el => el.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    toggleFavourite(el.dataset.heart, el);
  }));
  syncHeartButtons();
  renderRecommendations();
  renderWelcomeBack();
  syncPreviewBanner();

  updateActionbar();
  wireCategoryStuck();
  wireMenuFilters();
  try { window.ArmenuFX?.scan($('content')); } catch {}
  try { renderOrderAgain(); setTimeout(maybeStartTour, 900); } catch {}
  // Lazy-load dish thumbnails via IntersectionObserver — only load images that come into view
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) {
        const bg = e.target.dataset.bg;
        if (bg) { e.target.style.backgroundImage = `url('${bg}')`; e.target.removeAttribute('data-bg'); }
        io.unobserve(e.target);
      }
    }, { rootMargin: '200px' });
    document.querySelectorAll('.thumb[data-bg]').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.thumb[data-bg]').forEach(el => { el.style.backgroundImage = `url('${el.dataset.bg}')`; });
  }
  revealHashDish();
}

// Deep links (#dish-<slug>: favourites, recent orders, "Choose options" from view.html,
// recommendations). The browser's native hash scroll can't reach a dish inside a collapsed
// <details> category (and runs before the menu even renders), so open the section and
// scroll ourselves. Handles each distinct hash once so later re-renders (search, language)
// don't keep yanking the page back.
let _hashHandled = null, _hashBusy = false;
function revealHashDish() {
  const h = location.hash;
  if (_hashBusy || !h || h.indexOf('#dish-') !== 0 || _hashHandled === h) return;
  let slug; try { slug = decodeURIComponent(h.slice(6)); } catch { return; }
  const known = state.menu?.dishes?.some(d => d.slug === slug);
  if (!known) { _hashHandled = h; return; }
  const el = document.getElementById('dish-' + slug);
  if (!el) {
    // Dish exists but isn't in the DOM: either the guest's own search/diet filter hides it,
    // or (few categories) it lives in a category tab that isn't active. Fix the state and
    // re-render; the second pass finds the element, so this can't loop.
    if (state.searchQuery || state.dietFilters.size) {
      state.searchQuery = ''; state.dietFilters.clear();
      const s = $('menuSearch'); if (s) s.value = '';
      const sc = $('menuSearchClear'); if (sc) sc.style.display = 'none';
      syncFiltersToUrl(); syncDietChips();
    }
    const cat = state.categories.find(c => c.items.some(d => d.slug === slug));
    if (cat) state.activeCategory = cat.key;
    _hashBusy = true;
    try { render(); } finally { _hashBusy = false; }
    _hashHandled = h;   // one attempt per hash — never loop
    const el2 = document.getElementById('dish-' + slug);
    if (el2) {
      const det2 = el2.closest('details.cat-section');
      if (det2 && !det2.open) det2.open = true;
      requestAnimationFrame(() => el2.scrollIntoView({ behavior: 'smooth', block: 'center' }));
    }
    return;
  }
  _hashHandled = h;
  const det = el.closest('details.cat-section');
  if (det && !det.open) det.open = true;
  requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }));
}
window.addEventListener('hashchange', () => { _hashHandled = null; if (state.menu) { closeSheet(); revealHashDish(); } });

function wireCategoryStuck() {
  const nav = document.querySelector('.category-nav');
  if (!nav) return;
  const check = () => {
    const top = nav.getBoundingClientRect().top;
    nav.classList.toggle('stuck', top <= 53);
  };
  window.removeEventListener('scroll', window.__catStuck || (() => {}));
  window.__catStuck = check;
  window.addEventListener('scroll', check, { passive: true });
  check();
  // Hide the edge-fade mask once the chip row is scrolled to its end, or
  // if it doesn't overflow at all, so the fade doesn't imply hidden content
  // that isn't there.
  const checkEnd = () => {
    const atEnd = nav.scrollWidth - nav.clientWidth <= nav.scrollLeft + 4;
    nav.classList.toggle('at-end', atEnd);
  };
  nav.removeEventListener('scroll', nav.__catEnd || (() => {}));
  nav.__catEnd = checkEnd;
  nav.addEventListener('scroll', checkEnd, { passive: true });
  checkEnd();
}

// Render small "contains" chips for common allergens (nuts, dairy, gluten,
// egg, shellfish, soy, sesame). Positive-diet tags (vegan/vegetarian/halal)
// are shown separately in green.
const ALLERGEN_ICONS = {
  nuts: '🥜', peanut: '🥜', tree_nut: '🥜', 'tree nut': '🥜',
  dairy: '🥛', milk: '🥛', cheese: '🥛', lactose: '🥛',
  gluten: '🌾', wheat: '🌾',
  egg: '🥚',
  fish: '🐟', shellfish: '🦐', prawn: '🦐', shrimp: '🦐',
  soy: '🫘', sesame: '🌰', alcohol: '🍷', pork: '🥓'
};
const POSITIVE_TAGS = { vegan: '🌱 Vegan', vegetarian: '🥬 Vegetarian', halal: '🕌 Halal', kosher: '✡ Kosher', 'gluten-free': '🌾 Gluten-free', 'dairy-free': '🥛 Dairy-free' };
function renderAllergenChips(raw) {
  if (!raw) return '';
  const tags = String(raw).toLowerCase().split(/[,;]+/).map(s => s.trim()).filter(Boolean);
  if (!tags.length) return '';
  const contains = [];
  const positive = [];
  for (const t of tags) {
    if (POSITIVE_TAGS[t]) positive.push(POSITIVE_TAGS[t]);
    else if (ALLERGEN_ICONS[t]) contains.push(ALLERGEN_ICONS[t] + ' ' + t);
  }
  const parts = [];
  if (positive.length) parts.push(`<span class="diet-pos">${positive.map(escapeHTML).join(' · ')}</span>`);
  if (contains.length) parts.push(`<span class="diet-warn" title="Ingredients">Contains ${contains.map(escapeHTML).join(' · ')}</span>`);
  return parts.length ? `<div class="diet-chips">${parts.join('')}</div>` : '';
}

function popChip(d) {
  if (!state.menu || (state.menu.orders_7d || 0) < 20) return '';
  const sc = Number(d.popularity_score) || 0;
  if (sc >= 90) return '<div class="pop-chip trending">🔥 Trending</div>';
  if (sc >= 70) return '<div class="pop-chip">🔥 Popular</div>';
  return '';
}

// ============ SEARCH / DIETARY MATCHING ============
function tagList(v) { return Array.isArray(v) ? v.join(',') : String(v || ''); }
function dishTagText(d) { return (tagList(d.allergens) + ',' + tagList(d.dietary_prefs)).toLowerCase(); }
// Search covers name, translated name, description (ingredients live there),
// allergens and dietary prefs. Every whitespace-separated term must match.
function dishMatchesSearch(d, q) {
  if (!q) return true;
  const tr = d.translations && typeof d.translations === 'object'
    ? Object.values(d.translations).map(t => (t && (t.name || '') + ' ' + (t && t.description || ''))).join(' ') : '';
  const hay = ((d.name || '') + ' ' + (d.description || '') + ' ' + tr + ' ' + dishTagText(d).replace(/[,;_]+/g, ' ')).toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
const RE_MEAT = /\b(beef|pork|bacon|ham|chicken|fish|meat|lamb|prawns?|shrimp|salmon|tuna|steak|turkey|duck|anchov\w*)\b/;
const RE_ANIMAL = /\b(dairy|egg|eggs|cheese|milk|butter|honey|cream|yogh?urt|mayo|mayonnaise)\b/;
const RE_GLUTEN = /\b(gluten|wheat|barley|rye|flour|bread|pasta|noodles?)\b/;
const RE_DAIRY = /\b(dairy|milk|cheese|butter|cream|yogh?urt|lactose)\b/;
const RE_NUTS = /\b(nuts?|peanuts?|almonds?|cashews?|walnuts?|pecans?|hazelnuts?|pistachios?|tree[ _]nuts?)\b/;
function dishMatchesDiet(d, key) {
  const tags = dishTagText(d);
  // Ingredients are parsed from the description; positive tags ("dairy-free") are stripped first.
  const all = (tags + ' ' + (d.description || '').toLowerCase()).replace(/(dairy|gluten|nut)[- ]free/g, ' ');
  const tagged = (...k) => k.some(x => tags.includes(x));
  switch (key) {
    case 'vegan':       return tagged('vegan') || (!RE_MEAT.test(all) && !RE_ANIMAL.test(all));
    case 'vegetarian':  return tagged('vegetarian', 'vegan') || !RE_MEAT.test(all);
    case 'halal':       return tagged('halal') && !/\b(pork|bacon|ham|alcohol|wine|beer)\b/.test(all);
    case 'gluten-free': return tagged('gluten-free', 'gluten free') || !RE_GLUTEN.test(all);
    case 'dairy-free':  return tagged('dairy-free', 'dairy free', 'vegan') || !RE_DAIRY.test(all);
    case 'nut-free':    return tagged('nut-free', 'nut free') || !RE_NUTS.test(all);
    default: return true;
  }
}

// ============ COLLAPSIBLE CATEGORY STATE (sessionStorage, per restaurant) ============
function catOpenMap() {
  try { const o = JSON.parse(sessionStorage.getItem('armenu_cats_' + r) || '{}'); return o && typeof o === 'object' ? o : {}; } catch { return {}; }
}
function saveCatOpen(key, open) {
  try { const o = catOpenMap(); o[key] = !!open; sessionStorage.setItem('armenu_cats_' + r, JSON.stringify(o)); } catch {}
}

// ============ DISH COMPARISON TRAY (localStorage, max 3) ============
const CMP_MAX = 3;
function loadCompare() {
  try {
    const a = JSON.parse(localStorage.getItem('armenu_compare_' + r) || '[]');
    return Array.isArray(a) ? a.filter(x => typeof x === 'string').slice(0, CMP_MAX) : [];
  } catch { return []; }
}
function saveCompare(a) { try { localStorage.setItem('armenu_compare_' + r, JSON.stringify(a)); } catch {} }
function toggleCompare(slug) {
  const a = loadCompare();
  const i = a.indexOf(slug);
  if (i >= 0) a.splice(i, 1);
  else {
    if (a.length >= CMP_MAX) return toast(`You can compare up to ${CMP_MAX} dishes`, 'err');
    a.push(slug);
  }
  saveCompare(a);
  updateCompareUi();
  if ($('sheet').classList.contains('on') && $('sheetBody').querySelector('.cmp-cols')) openCompare();
}
function updateCompareUi() {
  const a = loadCompare();
  document.querySelectorAll('[data-cmp]').forEach(el => {
    const on = a.includes(el.dataset.cmp);
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
    el.textContent = on ? '✓ compare' : '+ compare';
  });
  const chip = $('cmpChip');
  if (chip) { chip.textContent = `Compare (${a.length})`; chip.classList.toggle('on', a.length > 0); }
}
function openCompare() {
  const all = state.menu?.dishes || [];
  const sym = curSym();
  const dishes = loadCompare().map(s => all.find(d => d.slug === s)).filter(Boolean);
  if (!dishes.length) { closeSheet(); updateCompareUi(); return; }
  const canOrder = !!state.settings?.features?.orders;
  const cols = dishes.map(d => {
    const nm = d.translations?.[state.lang]?.name || d.name;
    const desc = d.translations?.[state.lang]?.description || d.description || '';
    const tags = String(dishTagText(d)).split(/[,;]+/).map(s => s.trim()).filter(Boolean);
    const pos = [...new Set(tags.filter(t => POSITIVE_TAGS[t]).map(t => POSITIVE_TAGS[t]))];
    const con = [...new Set(tags.filter(t => !POSITIVE_TAGS[t] && ALLERGEN_ICONS[t]).map(t => ALLERGEN_ICONS[t] + ' ' + t))];
    const price = d.price_cents ? fmtPrice(d.price_cents, sym) : (d.price || '—');
    const sold = d.sold_out === true;
    const chipRow = arr => arr.length ? `<div class="diet-chips"><span class="${arr === pos ? 'diet-pos' : 'diet-warn'}">${arr.map(escapeHTML).join(' · ')}</span></div>` : '<div class="cmp-desc">—</div>';
    return `<div class="cmp-col">
      <div class="cmp-photo"${d.thumb ? ` style="background-image:url('${escapeHTML(d.thumb)}')"` : ''}>${d.thumb ? '' : escapeHTML((nm || '?')[0])}</div>
      <div class="cmp-name">${escapeHTML(nm)}</div>
      <div class="cmp-price">${escapeHTML(price)}</div>
      <div><div class="cmp-lbl">Description</div><div class="cmp-desc">${escapeHTML(desc) || '—'}</div></div>
      <div><div class="cmp-lbl">Allergens</div>${chipRow(con)}</div>
      <div><div class="cmp-lbl">Dietary</div>${chipRow(pos)}</div>
      <div><div class="cmp-lbl">Popularity</div>${popChip(d) || '<div class="cmp-desc">—</div>'}</div>
      ${canOrder ? `<button type="button" class="cmp-add" data-cmp-add="${escapeHTML(d.slug)}"${sold ? ' disabled' : ''}>${sold ? 'Sold out' : '+ Add to cart'}</button>` : ''}
      <button type="button" class="cmp-rm" data-cmp-rm="${escapeHTML(d.slug)}">Remove</button>
    </div>`;
  }).join('');
  openSheet(`<h3>Compare dishes</h3><div class="sh-sub">${dishes.length} of ${CMP_MAX} selected</div>
    <div class="cmp-cols">${cols}</div>
    <button type="button" class="cmp-clear" id="cmpClear">Clear all</button>`);
  $('sheetBody').querySelectorAll('[data-cmp-add]').forEach(b => b.onclick = () => addToCart(b.dataset.cmpAdd));
  $('sheetBody').querySelectorAll('[data-cmp-rm]').forEach(b => b.onclick = () => toggleCompare(b.dataset.cmpRm));
  $('cmpClear').onclick = () => { saveCompare([]); updateCompareUi(); closeSheet(); };
}

// ---- Opening hours / combos helpers ----
// NOTE: is_open / opening hours are informational only. Nothing here is gated on them
// (restaurants may run specials outside listed hours).
function renderCombos() {
  const combos = (state.menu && Array.isArray(state.menu.combos)) ? state.menu.combos : [];
  if (!combos.length) return '';
  const sym = curSym();
  const showOrder = state.settings.features.orders;
  return `<section class="combos-strip"><div class="section-label">🍽 Combos</div><div class="combos-row">${combos.map(c => `
    <div class="combo-card" id="combo-${escapeHTML(c.slug)}">
      <div class="combo-thumb"${c.thumb_url ? ` style="background-image:url('${escapeHTML(encodeURI(String(c.thumb_url)).replace(/['()]/g, ch => '%' + ch.charCodeAt(0).toString(16)))}')"` : ''}>${c.thumb_url ? '' : '🍽'}</div>
      <div class="combo-info">
        <div class="combo-name">${escapeHTML(c.name)}</div>
        <div class="combo-items">${(c.item_names || []).map(escapeHTML).join(' + ')}</div>
        ${c.description ? `<div class="combo-desc">${escapeHTML(c.description)}</div>` : ''}
        ${c.savings_cents > 0 ? `<div class="combo-save">Save ${escapeHTML(fmtPrice(c.savings_cents, sym))}</div>` : ''}
        <div class="combo-foot">
          <div class="combo-price">${escapeHTML(fmtPrice(c.price_cents, sym))}</div>
          ${showOrder ? `<button class="combo-add" data-add-combo="${escapeHTML(c.id)}">+ Add</button>` : ''}
        </div>
      </div>
    </div>`).join('')}</div></section>`;
}
function addComboToCart(id) {
  const c = (state.menu.combos || []).find(x => x.id === id);
  if (!c) return;
  const key = 'combo::' + c.id;
  const existing = state.cart.find(i => i.key === key);
  if (existing) existing.qty++;
  else state.cart.push({ key, combo_id: c.id, slug: null, name: c.name + ' (combo)', qty: 1, price_cents: c.price_cents || 0, modifiers: [] });
  saveCart();
  updateActionbar();
  window.ArMenuSound?.play('pop');
  toast(`Added ${c.name}`, 'ok');
}

function renderDish(d, idx) {
  const sym = curSym();
  const price = d.price_cents ? fmtPrice(d.price_cents, sym) : (d.price || '');
  const nameTr = d.translations?.[state.lang]?.name || d.name;
  const descTr = d.translations?.[state.lang]?.description || d.description || '';
  const showOrder = state.settings.features.orders;

  const soldOut = d.sold_out === true;
  const lowStock = !soldOut && typeof d.stock === 'number' && d.stock > 0 && d.stock <= 3;
  const stockStatus = soldOut ? 'sold out' : (lowStock ? `only ${d.stock} left` : 'view in AR');
  const thumbAriaLabel = `${nameTr}, ${stockStatus}`;
  const isFav = customerFavKeys.has(r + '::' + d.slug);
  // First ~4 above-the-fold tiles load their thumbnail immediately
  // (eager/high-priority); everything else waits for the IntersectionObserver
  // below to lazy-load it as it scrolls into view.
  const isAboveFold = typeof idx === 'number' && idx < 4;
  const thumbAttrs = isAboveFold
    ? `loading="eager" fetchpriority="high"`
    : `loading="lazy" fetchpriority="low"`;
  const thumbBgAttr = d.thumb
    ? (isAboveFold ? `style="background-image:url('${d.thumb}')"` : `data-bg="${d.thumb}"`)
    : '';
  return `
    <div class="dish${soldOut ? ' sold-out' : ''}" data-fx="reveal" id="dish-${escapeHTML(d.slug)}">
      <button type="button" class="cmp-btn" data-cmp="${escapeHTML(d.slug)}" aria-pressed="false" aria-label="Compare ${escapeHTML(nameTr)}">+ compare</button>
      <button type="button" class="heart-btn${isFav ? ' on' : ''}" data-heart="${escapeHTML(d.slug)}" aria-pressed="${isFav ? 'true' : 'false'}" aria-label="Favourite ${escapeHTML(nameTr)}">♥</button>
      <a href="/view.html?r=${encodeURIComponent(r)}&d=${encodeURIComponent(d.slug)}${table ? '&t=' + encodeURIComponent(table) : ''}" class="thumb-link" aria-label="${escapeHTML(thumbAriaLabel)}">
        <div class="thumb" data-fx="spotlight" ${thumbAttrs} ${thumbBgAttr}>
          ${d.thumb ? '' : `<span class="thumb-fallback" aria-hidden="true">${escapeHTML(nameTr[0] || '?')}</span>`}
          ${soldOut ? '<span class="stock-tag sold">Sold out</span>' : (lowStock ? `<span class="stock-tag low">Only ${d.stock} left</span>` : '<span class="ar-tag">View in AR</span>')}
        </div>
      </a>
      <div class="info">
        <div class="top-row">
          <div class="name">${escapeHTML(nameTr)}</div>
          ${d.discount_pct
            ? `<div class="price-block">
                 <div class="price-old">${escapeHTML(d.original_price || '')}</div>
                 <div class="price price-new">${escapeHTML(price)}</div>
               </div>`
            : (price ? `<div class="price">${escapeHTML(price)}</div>` : '')}
        </div>
        ${d.discount_pct ? `<div class="offer-tag">🎉 ${escapeHTML(d.offer_name || 'Happy hour')} · -${d.discount_pct}%</div>` : ''}
        ${popChip(d)}
        ${descTr ? `<div class="desc">${escapeHTML(descTr)}</div>` : ''}
        ${renderAllergenChips(d.allergens)}
        <div class="row">
          <a class="btn-ar" href="/view.html?r=${encodeURIComponent(r)}&d=${encodeURIComponent(d.slug)}${table ? '&t=' + encodeURIComponent(table) : ''}" style="display:flex;align-items:center;justify-content:center;text-decoration:none">See in AR →</a>
          ${showOrder && !soldOut ? `<button class="btn-add" data-add="${escapeHTML(d.slug)}">+ Add</button>` : ''}
          ${showOrder && soldOut ? `<button class="btn-add" disabled style="opacity:.4;cursor:not-allowed">Sold out</button>` : ''}
        </div>
      </div>
    </div>`;
}

function updateActionbar() {
  const skel = $('actionbarSkeleton');
  if (skel) skel.style.display = 'none';
  const f = state.settings.features;
  const bar = $('actionbar');
  const any = f.orders || f.waiter_call || f.reviews || f.reservations !== false;
  bar.style.display = any ? 'flex' : 'none';
  $('waiterBtn').style.display  = f.waiter_call ? 'flex' : 'none';
  const bb = $('billBtn');
  if (bb) {
    bb.style.display = f.waiter_call ? 'flex' : 'none';
    const has = !!loadLastOrder();
    bb.disabled = !has || !!bb._busy;
    bb.title = has ? '' : 'Order first';
    if (!bb.dataset.wired) { bb.dataset.wired = '1'; bb.onclick = sendBillCall; }
  }
  $('cartBtn').style.display    = f.orders ? 'flex' : 'none';
  $('reviewBtn').style.display  = f.reviews ? 'flex' : 'none';
  // Reservations button ONLY shows when guest is NOT at a table (no ?t= param).
  // If they scanned a table QR, they're already there — booking is nonsense.
  $('reserveBtn').style.display = (f.reservations !== false && !table) ? 'flex' : 'none';
  $('cartCount').textContent = state.cart.reduce((s, i) => s + i.qty, 0);
  // Make Order button primary (full-width when it's the only cart action)
  const cartOnlyPrimary = f.orders && !f.waiter_call && !f.reviews;
  $('cartBtn').style.flex = cartOnlyPrimary ? '2' : '1';
}

// Wire search + dietary chip filters (idempotent — safe to call every render)
function wireMenuFilters() {
  const filters = $('menuFilters');
  if (!filters) return;
  filters.style.display = '';
  // Search
  const s = $('menuSearch');
  if (s && !s.dataset.wired) {
    s.dataset.wired = '1';
    s.value = state.searchQuery || '';
    $('menuSearchClear').style.display = s.value ? 'inline-block' : 'none';
    s.oninput = (e) => {
      state.searchQuery = e.target.value;
      $('menuSearchClear').style.display = e.target.value ? 'inline-block' : 'none';
      syncFiltersToUrl();
      render();
    };
    $('menuSearchClear').onclick = () => { s.value = ''; state.searchQuery = ''; s.dispatchEvent(new Event('input')); };
  }
  // Dietary chips — multi-select, a dish must satisfy ALL active chips
  const chips = $('dietChips');
  if (chips && !chips.children.length) {
    const opts = [
      { key: 'vegan', label: '🌱 Vegan' },
      { key: 'vegetarian', label: '🥬 Vegetarian' },
      { key: 'halal', label: '☪ Halal' },
      { key: 'gluten-free', label: '🌾 GF' },
      { key: 'dairy-free', label: '🥛 Dairy-free' },
      { key: 'nut-free', label: '🥜 Nut-free' }
    ];
    chips.innerHTML = opts.map(o => `<button type="button" class="diet-chip" data-diet="${o.key}" aria-pressed="false">${o.label}</button>`).join('');
    chips.addEventListener('click', (e) => {
      const b = e.target.closest('[data-diet]'); if (!b) return;
      const k = b.dataset.diet;
      if (state.dietFilters.has(k)) state.dietFilters.delete(k); else state.dietFilters.add(k);
      syncDietChips();
      syncFiltersToUrl();
      render();
    });
  }
  syncDietChips();
}
function syncDietChips() {
  document.querySelectorAll('#dietChips [data-diet]').forEach(c => {
    const on = state.dietFilters.has(c.dataset.diet);
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

// ============ RESERVATION ============
const RV_PREFS = ['Window', 'Quiet', 'Booster seat', 'Outside'];
const RV_OPEN_MIN = 11 * 60, RV_LAST_MIN = 21 * 60 + 30;   // 11:00 – 21:30, 30-min slots
function rvPad(n) { return String(n).padStart(2, '0'); }
function openReserve() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(today); d.setDate(today.getDate() + i); return d; });
  const dayKey = d => d.getFullYear() + '-' + rvPad(d.getMonth() + 1) + '-' + rvPad(d.getDate());
  let selDay = null, selTime = null;
  const prefs = new Set();
  // Capacity preview (feature-flagged, OFF unless restaurant_settings.capacity_preview_enabled).
  let capOn = false;
  const capCache = {};
  const CAP_LBL = { plenty: ['🟢', 'plenty of space'], filling: ['🟡', 'filling up'], nearly_full: ['🟠', 'nearly full'], full: ['🔴', 'full'] };
  const capSlug = () => (state.settings && state.settings.restaurant && state.settings.restaurant.slug) || r;
  const capFmt = label => { const [h, m] = label.split(':').map(Number); return ((h % 12) || 12) + ':' + rvPad(m) + (h < 12 ? 'am' : 'pm'); };
  const stripHtml = days.map((d, i) => `<button type="button" class="rv-day" data-rvday="${i}" aria-pressed="false">
      <span class="dw">${i === 0 ? 'Today' : d.toLocaleDateString('en-ZA', { weekday: 'short' })}</span>
      <span class="dn">${d.getDate()}</span>
      <span class="dm">${d.toLocaleDateString('en-ZA', { month: 'short' })}</span></button>`).join('');
  openSheet(`
    <h3>Book a table</h3>
    <div class="sh-sub">${escapeHTML(state.settings.restaurant.name)} · we'll confirm on WhatsApp</div>
    <div class="field"><label>Your name</label><input id="rvName" type="text" placeholder="Full name" /></div>
    <div class="field"><label>WhatsApp phone</label><input id="rvPhone" type="tel" placeholder="071 234 5678" /></div>
    <div class="field"><label>Email (optional, for confirmation)</label><input id="rvEmail" type="email" placeholder="you@email.com" /></div>
    <div class="field"><label>Party size</label><input id="rvSize" type="number" min="1" max="20" value="2" /></div>
    <div class="field"><label>Pick a day</label><div class="rv-strip" id="rvStrip" role="group" aria-label="Pick a day">${stripHtml}</div></div>
    <div class="field" id="rvSlotWrap" style="display:none"><label>Pick a time</label><div class="rv-slots" id="rvSlots" role="group" aria-label="Pick a time"></div></div>
    <input id="rvWhen" type="hidden" value="" />
    <div class="field"><label>Table preference (optional)</label><div class="rv-prefs" id="rvPrefs">${RV_PREFS.map(p => `<button type="button" class="rv-pref" data-pref="${escapeHTML(p)}" aria-pressed="false">${escapeHTML(p)}</button>`).join('')}</div></div>
    <div class="field"><label>Anything else? (optional)</label><textarea id="rvNotes" rows="2" placeholder="High chair, allergies, occasion…"></textarea></div>
    <button class="submit" id="rvSubmit">Request booking →</button>
  `);
  function syncWhen() {
    $('rvWhen').value = (selDay !== null && selTime) ? dayKey(days[selDay]) + 'T' + selTime : '';
  }
  function renderSlots() {
    const wrap = $('rvSlotWrap'), box = $('rvSlots');
    if (selDay === null) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const capKey = dayKey(days[selDay]);
    if (capOn && !capCache[capKey]) {
      capCache[capKey] = 'loading';
      fetch('/api/reservation-capacity?slug=' + encodeURIComponent(capSlug()) + '&date=' + capKey)
        .then(x => x.ok ? x.json() : [])
        .then(a => { capCache[capKey] = Array.isArray(a) ? Object.fromEntries(a.map(o => [o.time, o])) : {}; })
        .catch(() => { capCache[capKey] = {}; })
        .then(() => { if (selDay !== null && dayKey(days[selDay]) === capKey) renderSlots(); });
    }
    const capData = capOn && capCache[capKey] && capCache[capKey] !== 'loading' ? capCache[capKey] : null;
    const base = days[selDay];
    const cutoff = Date.now() + 30 * 60 * 1000;
    let html = '';
    let stillValid = false;
    for (let m = RV_OPEN_MIN; m <= RV_LAST_MIN; m += 30) {
      const t = new Date(base); t.setHours(Math.floor(m / 60), m % 60, 0, 0);
      const label = rvPad(t.getHours()) + ':' + rvPad(t.getMinutes());
      const past = t.getTime() < cutoff;
      const on = label === selTime && !past;
      if (on) stillValid = true;
      const c = capData && capData[label];
      if (c && CAP_LBL[c.available]) {
        const full = c.available === 'full';
        html += `<button type="button" class="rv-slot rv-slot-cap${on ? ' on' : ''}" data-rvtime="${label}" aria-pressed="${on}"${past || full ? ' disabled' : ''}>${CAP_LBL[c.available][0]} ${capFmt(label)} — ${CAP_LBL[c.available][1]}</button>`;
      } else {
        html += `<button type="button" class="rv-slot${on ? ' on' : ''}" data-rvtime="${label}" aria-pressed="${on}"${past ? ' disabled' : ''}>${label}</button>`;
      }
    }
    box.innerHTML = html;
    if (!stillValid) selTime = null;
    syncWhen();
  }
  fetch('/api/reservation-capacity?slug=' + encodeURIComponent(capSlug()) + '&flag=1')
    .then(x => x.ok ? x.json() : null)
    .then(j => { if (j && j.enabled === true) { capOn = true; if (selDay !== null) renderSlots(); } })
    .catch(() => {});
  $('rvStrip').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rvday]'); if (!b) return;
    selDay = parseInt(b.dataset.rvday, 10);
    $('rvStrip').querySelectorAll('.rv-day').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    renderSlots();
  });
  $('rvSlotWrap').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rvtime]'); if (!b || b.disabled) return;
    selTime = b.dataset.rvtime;
    $('rvSlots').querySelectorAll('.rv-slot').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    syncWhen();
  });
  $('rvPrefs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pref]'); if (!b) return;
    const p = b.dataset.pref;
    if (prefs.has(p)) prefs.delete(p); else prefs.add(p);
    b.classList.toggle('on', prefs.has(p));
    b.setAttribute('aria-pressed', prefs.has(p) ? 'true' : 'false');
  });
  $('rvSubmit').onclick = async () => {
    const name = $('rvName').value.trim();
    const phone = $('rvPhone').value.trim();
    const email = $('rvEmail').value.trim();
    const size = parseInt($('rvSize').value) || 2;
    const when = $('rvWhen').value;
    const preferences = RV_PREFS.filter(p => prefs.has(p));
    let notes = $('rvNotes').value.trim();
    // The reservation API stores free-text notes today; mirror the chips there
    // so the restaurant sees them even before the preferences column is read.
    if (preferences.length) notes = (notes ? notes + '\n' : '') + 'Table preference: ' + preferences.join(', ');
    if (!name) return toast('Name required', 'err');
    if (!when) return toast('Pick a day and a time', 'err');
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('That email doesn\'t look valid', 'err');
    // Require at least one contact channel — otherwise the guest has no
    // way to be reached with the restaurant's confirmation/decline.
    if (!email && !phone) return toast('Add an email or phone so the restaurant can confirm', 'err');
    $('rvSubmit').disabled = true; $('rvSubmit').textContent = 'Sending…';
    let res, data;
    try {
      res = await fetch('/api/reservation', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ r, guest_name: name, guest_phone: phone, guest_email: email, party_size: size, reserved_at: new Date(when).toISOString(), notes, preferences })
      });
      data = await res.json().catch(() => ({}));
    } catch (netErr) {
      $('rvSubmit').disabled = false; $('rvSubmit').textContent = 'Request booking →';
      return toast('No connection — please try again in a moment', 'err');
    }
    if (!res.ok) { $('rvSubmit').disabled = false; $('rvSubmit').textContent = 'Request booking →'; return toast(data.message || data.error || 'Failed', 'err'); }
    // Confirmation card — three cases: email actually delivered, they only
    // left a phone, or they left neither (blocked above but safe default).
    const emailNote = data.email_sent
      ? `A confirmation was sent to <b>${escapeHTML(email)}</b>.`
      : (phone
        ? 'The restaurant will confirm by phone or WhatsApp.'
        : 'The restaurant has received your request. Please check back or contact them directly.');
    const canOrder = !!state.settings?.features?.orders;
    $('sheet').innerHTML = `
      <div style="padding:28px 24px;text-align:center">
        <div style="font-size:52px;margin-bottom:8px">✓</div>
        <h2 style="margin:0 0 8px;font-size:22px">Booking received</h2>
        <p style="color:#8b8580;font-size:13.5px;line-height:1.55;margin:0 0 20px">${emailNote}</p>
        ${data.ics_data_url ? `<a href="${data.ics_data_url}" download="reservation-${data.reservation_id}.ics" style="display:inline-block;padding:12px 22px;border-radius:10px;background:linear-gradient(135deg,#e8c58a,#d4a574);color:#0a0806;font-weight:700;text-decoration:none;margin-bottom:10px">📅 Add to calendar</a><br>` : ''}
        ${canOrder ? `<p style="margin:16px 0 8px;font-size:14px;font-weight:600">Want to order in advance?</p>
        <button id="rvMenu" style="padding:11px 20px;min-height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;cursor:pointer;border:none">Go to menu</button><br>` : ''}
        <button id="rvDone" style="margin-top:10px;padding:10px 18px;min-height:44px;background:rgba(245,239,220,.05);color:#e8c58a;border:1px solid rgba(232,197,138,.3);border-radius:9px;font-weight:600;cursor:pointer">Done</button>
      </div>`;
    document.getElementById('rvDone').onclick = closeSheet;
    const gm = document.getElementById('rvMenu');
    if (gm) gm.onclick = () => {
      closeSheet();
      const m = document.querySelector('main');
      if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast('Pick your dishes, then tap Order', 'ok');
    };
  };
}

function reorderFromHistory(orderId) {
  const o = customerRecentOrders.find(x => x.order_id === orderId);
  if (!o || !Array.isArray(o.item_slugs)) return;
  let total = 0, added = 0;
  for (const it of o.item_slugs) {
    const qty = Math.max(1, parseInt(it.qty, 10) || 1);
    total += qty;
    const dish = state.menu?.dishes?.find(d => d.slug === it.slug);
    if (!dish || dish.sold_out) continue;
    // A dish with a required option group can't be re-added blind (the picker is what
    // enforces the choice, and history doesn't store which options were picked).
    if (Array.isArray(dish.modifiers) && dish.modifiers.some(g => g && g.required)) continue;
    const key = dish.slug + '::';
    const existing = state.cart.find(i => i.key === key);
    if (existing) existing.qty += qty;
    else state.cart.push({ key, slug: dish.slug, name: dish.name, qty, price_cents: unitPriceCents(dish, []), modifiers: [] });
    added += qty;
  }
  saveCart();
  updateActionbar();
  closeSheet();
  toast(`Added ${added} of ${total} items` + (added < total ? ` — ${total - added} couldn't be added (unavailable or need options)` : ''), added ? 'ok' : 'err');
}

// Per-unit price the SERVER will charge (api/order.js): (base + modifier deltas), then the
// active offer % applied to that whole sum. The menu payload's price_cents is already
// discounted and modifier deltas are not, so adding them naively over-charged the
// on-screen total for any discounted dish with paid modifiers.
function unitPriceCents(dish, picked) {
  let modSum = 0;
  for (const m of (picked || [])) {
    const [gi, oi] = String(m.id).split('-').map(Number);
    const o = dish.modifiers?.[gi]?.options?.[oi];
    modSum += o ? (parseInt(o.price_cents_delta, 10) || 0) : (m.price_cents_delta || 0);
  }
  if (dish.discount_pct && typeof dish.original_price_cents === 'number') {
    return Math.max(0, Math.round((dish.original_price_cents + modSum) * (100 - dish.discount_pct) / 100));
  }
  return Math.max(0, (dish.price_cents || 0) + modSum);
}
// Re-price carts restored from localStorage/bfcache against the live menu (prices, offers
// and modifier deltas may have changed since they were saved). Never drops items: a dish
// can be hidden by a menu schedule yet still orderable, and the server has the final say.
function reconcileCart() {
  const dishes = state.menu && state.menu.dishes;
  if (!Array.isArray(dishes) || !state.cart.length) return;
  const combos = Array.isArray(state.menu.combos) ? state.menu.combos : [];
  let changed = false;
  for (const it of state.cart) {
    let p = null;
    if (it.combo_id) {
      const c = combos.find(x => x.id === it.combo_id);
      if (c) p = c.price_cents || 0;
    } else {
      const d = dishes.find(x => x.slug === it.slug);
      if (d) p = unitPriceCents(d, it.modifiers);
    }
    if (p != null && it.price_cents !== p) { it.price_cents = p; changed = true; }
  }
  if (changed) saveCart();
}

function addToCart(slug, mods) {
  const dish = state.menu.dishes.find(d => d.slug === slug);
  if (!dish) return;
  // If dish has modifiers and none passed → open the modifier picker instead of adding raw.
  const dishMods = Array.isArray(dish.modifiers) ? dish.modifiers : [];
  if (dishMods.length && !mods) return openModifierPicker(dish);
  const picked = Array.isArray(mods) ? mods : [];
  const key = slug + '::' + picked.map(m => m.id).sort().join('|');
  const existing = state.cart.find(i => i.key === key);
  if (existing) existing.qty++;
  else state.cart.push({ key, slug, name: dish.name, qty: 1, price_cents: unitPriceCents(dish, picked), modifiers: picked });
  saveCart();
  updateActionbar();
  window.ArMenuSound?.play('pop');

// Cart persistence — survives page refreshes, kid-yanks, incoming WhatsApp taps.
// Auto-expires after 24h so an abandoned cart from yesterday doesn't reload today.
// Declared before loadCart(): an expired cart calls clearCart(), which assigns _cartDraft —
// with the `let` further down that hit the temporal dead zone, threw, and left the stale
// cart in storage (where view.html's add-to-cart then resurrected it).
let _cartDraft = { note: '', tableInput: '' };
const CART_KEY = 'armenu_cart_' + r + (table ? '_' + table : '');
const CART_MAX_AGE_MS = 24 * 60 * 60 * 1000;
function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify({ ts: Date.now(), items: state.cart })); } catch {}
}
function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // Backward-compat: previously stored as bare array
    if (Array.isArray(parsed)) { state.cart = parsed; return; }
    if (parsed && Array.isArray(parsed.items)) {
      if (Date.now() - (parsed.ts || 0) > CART_MAX_AGE_MS) { clearCart(); return; }
      state.cart = parsed.items;
    }
  } catch {}
}
function clearCart() { state.cart = []; _cartDraft = { note: '', tableInput: '' }; try { localStorage.removeItem(CART_KEY); } catch {} }
loadCart();
// Re-read the cart from storage (another tab, or view.html's +Add, may have changed it).
function reloadCartFromStorage() {
  try {
    if ($('sheet').classList.contains('on') && $('orderSend')) return;   // don't yank the cart out from under an open checkout
    const raw = localStorage.getItem(CART_KEY);
    let items = [];
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) items = parsed;
      else if (parsed && Array.isArray(parsed.items) && Date.now() - (parsed.ts || 0) <= CART_MAX_AGE_MS) items = parsed.items;
    }
    if (JSON.stringify(items) === JSON.stringify(state.cart)) return;
    state.cart = items;
    reconcileCart();
    if (state.settings) updateActionbar();
  } catch {}
}
window.addEventListener('storage', (e) => { if (e.key === CART_KEY) reloadCartFromStorage(); });

let _orderInFlight = false;
let _pendingOrder = null;   // { sig, id, ts } — idempotency key kept across retries of the SAME cart
async function submitOrder() {
  if (_orderInFlight) return;   // second tap (or a re-rendered cart sheet's fresh button) while one is sending
  _orderInFlight = true;
  const btn = $('orderSend'); btn.disabled = true; btn.textContent = 'Sending…';
  const note = $('orderNote')?.value.trim() || undefined;
  const tbl = table || $('orderTable')?.value.trim() || undefined;
  const subtotal = state.cart.reduce((s, i) => s + i.price_cents * i.qty, 0);
  const tip_cents = Math.round(subtotal * (_tipPct / 100));
  const redeem_loyalty = loyaltyRedeeming();
  let total_cents = subtotal - loyaltyDiscountFor(subtotal) + tip_cents;
  // Client-side idempotency key — a network retry (spotty mobile signal
  // dropping the response leg after the DB write) sends the same key so
  // the server can short-circuit and return the same order_id.
  // The key must SURVIVE a failed attempt: generating a fresh one per tap made the
  // server's dedupe useless for exactly the case it exists for (response lost after the
  // DB write, guest taps Send again). Reuse it while the cart/tip/table/note are unchanged
  // (and within the server's 15 min window); a changed cart is a new order and gets a new key.
  const sig = JSON.stringify([state.cart.map(i => [i.key, i.qty]), tip_cents, tbl || '', note || '', redeem_loyalty]);
  if (!_pendingOrder || _pendingOrder.sig !== sig || Date.now() - _pendingOrder.ts > 10 * 60 * 1000) {
    _pendingOrder = { sig, ts: Date.now(), id: (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)) };
  }
  const client_order_id = _pendingOrder.id;
  try {
    const res = await fetch('/api/order', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        r, table: tbl, note, tip_cents, client_order_id, customer_token: customerToken,
        ...(redeem_loyalty ? { redeem_loyalty: true } : {}),
        items: state.cart.map(i => i.combo_id ? { combo_id: i.combo_id, qty: i.qty } : { dish_slug: i.slug, qty: i.qty, modifiers: i.modifiers || [] })
      })
    });
    // A gateway error page (502/504 HTML) isn't JSON — don't surface "Unexpected token <".
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || 'Could not send. Please try again.');
    if (!data.order_id) throw new Error('Could not confirm your order. Please tap Send again.');
    _pendingOrder = null;
    if (typeof data.total_cents === 'number') total_cents = data.total_cents;
    _redeemLoyalty = false;

    // Snapshot the order for the persistent banner + confirmation panel
    // BEFORE the cart is cleared.
    const items_snapshot = state.cart.map(i => ({ name: i.name, qty: i.qty, price_cents: i.price_cents * i.qty }));
    const dishSummaryParts = state.cart.map(i => `${i.qty}x ${i.name}`);
    let dish_summary = dishSummaryParts.join(', ');
    if (dish_summary.length > 60) dish_summary = dish_summary.slice(0, 57) + '…';
    const order_number = String(data.order_id || '').replace(/-/g, '').slice(-6).toUpperCase() || '------';
    const lastOrder = {
      order_id: data.order_id,
      order_number,
      restaurant_slug: r,
      table: tbl || null,
      dish_summary,
      total_cents,
      placed_at: new Date().toISOString(),
      items: items_snapshot,
      dish_slugs: state.cart.filter(i => !i.combo_id).map(i => ({ slug: i.slug, name: i.name }))
    };
    saveLastOrder(lastOrder);

    clearCart(); updateActionbar();
    window.ArMenuSound?.play('chime');
    toast('Order sent. kitchen has it ✓', 'ok');
    renderLastOrderBanner();
    startOrderPolling();
    showOrderConfirmation(lastOrder);
    enableOrderReadyPush();   // fire-and-forget; never blocks the order flow
    refreshLoyalty();
  } catch (e) {
    toast(e instanceof TypeError ? 'No connection. Tap Send again to retry.' : e.message, 'err');
    btn.disabled = false; btn.textContent = 'Send to kitchen →';
  } finally { _orderInFlight = false; }
}

// Quietly ask for notification permission after an order and register a
// customer-scoped push subscription so the guest is pinged when it's ready.
// Every failure path is swallowed — push is a nicety, not part of ordering.
function b64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
const _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Returns true only when the subscription was actually registered with the server.
// `userInitiated` = called straight from a tap: iOS Safari only shows the permission
// prompt inside a user gesture, and by the time the order fetch resolves the gesture is gone.
async function enableOrderReadyPush(userInitiated) {
  try {
    if (!customerToken || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return false;
    if (Notification.permission === 'denied') return false;
    if (Notification.permission !== 'granted') {
      // TODO(bug-audit): iOS Safari (a) exposes PushManager only to home-screen-installed web apps
      // (so this silently returns above for a plain Safari tab) and (b) rejects
      // requestPermission() outside a tap. Can't verify on-device from here; the confirmation
      // sheet offers a tap-driven "Notify me" button on iOS as a fallback.
      if (_isIOS && !userInitiated) return false;
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return false;
    }
    const kr = await fetch('/api/push/vapid-key').then(x => x.json()).catch(() => null);
    if (!kr || !kr.publicKey) return false;
    // serviceWorker.ready never settles when no worker is registered — bound the wait.
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise(res => setTimeout(() => res(null), 6000))]);
    if (!reg) return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(kr.publicKey) });
    const res = await fetch('/api/push/subscribe', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON(), customer_token: customerToken, r })
    });
    return res.ok;
  } catch { return false; }
}

// Confetti burst + chime after the order confirmation renders.
function celebrateOrder() {
  try {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try {
      if (window.ArMenuSound && typeof ArMenuSound.play === 'function') ArMenuSound.play('chime');
      else {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          const ac = new AC(); const t0 = ac.currentTime;
          [659.25, 783.99, 1046.5].forEach((f, i) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.15, t0 + i * 0.09 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.09 + 0.3);
            o.connect(g); g.connect(ac.destination);
            o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 0.32);
          });
          setTimeout(() => { try { ac.close(); } catch {} }, 1200);
        }
      }
    } catch {}
    const colors = ['#e8c58a', '#ffb066', '#f5efdc', '#7bd88f', '#6ec1ff', '#ff7a90'];
    const wrap = document.createElement('div');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9998';
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      const size = 6 + Math.random() * 6;
      c.style.cssText = `position:absolute;top:-12px;left:${Math.random() * 100}%;width:${size}px;height:${size * 1.5}px;background:${colors[i % colors.length]};border-radius:2px;opacity:1;transition:transform ${1.6 + Math.random() * 1.2}s cubic-bezier(.25,.6,.5,1),opacity 2.6s ease-in`;
      wrap.appendChild(c);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        c.style.transform = `translate(${(Math.random() - 0.5) * 160}px,${window.innerHeight + 30}px) rotate(${Math.random() * 720}deg)`;
        c.style.opacity = '0';
      }));
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 3000);
  } catch {}
}

// Renders a simple receipt to an offscreen canvas and triggers a download.
// Falls back to just leaving the confirmation panel visible if canvas
// export isn't available (e.g. locked-down webview).
function saveOrderReceiptImage(order) {
  try {
    const sym = curSym();
    const w = 640, lineH = 30;
    const items = Array.isArray(order.items) ? order.items : [];
    const h = 210 + items.length * lineH;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('no canvas context');
    ctx.fillStyle = '#0a0806'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#e8c58a'; ctx.font = 'bold 30px sans-serif';
    ctx.fillText('✓ Order #' + order.order_number, 24, 46);
    ctx.fillStyle = '#c9c2b8'; ctx.font = '14px sans-serif';
    ctx.fillText((order.restaurant_slug || '') + (order.table ? ' · Table ' + order.table : ''), 24, 74);
    ctx.strokeStyle = '#3a342c'; ctx.beginPath(); ctx.moveTo(24, 90); ctx.lineTo(w - 24, 90); ctx.stroke();
    let y = 122;
    ctx.font = '15px sans-serif';
    items.forEach(it => {
      ctx.fillStyle = '#f5efdc';
      ctx.fillText(`${it.qty}x ${it.name}`, 24, y);
      ctx.fillStyle = '#e8c58a';
      ctx.textAlign = 'right'; ctx.fillText(fmtPrice(it.price_cents, sym) || '', w - 24, y); ctx.textAlign = 'left';
      y += lineH;
    });
    ctx.strokeStyle = '#3a342c'; ctx.beginPath(); ctx.moveTo(24, y + 4); ctx.lineTo(w - 24, y + 4); ctx.stroke();
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#e8c58a';
    ctx.fillText('Total ' + (fmtPrice(order.total_cents, sym) || ''), 24, y + 34);
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#7a746a';
    ctx.fillText('Placed ' + new Date(order.placed_at).toLocaleString(), 24, y + 58);

    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'armenu-order-' + order.order_number + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch {
    toast('Could not save image — the order details above are still visible', 'err');
  }
}

// ============ MY USUAL (saved combos per restaurant) ============
async function saveCartAsUsual() {
  if (!customerToken) return toast('Profile not ready yet', 'err');
  const slugs = [];
  for (const it of state.cart) {
    if (!it.slug || it.combo_id) continue;
    for (let n = 0; n < Math.max(1, it.qty | 0) && slugs.length < 30; n++) slugs.push(it.slug);
  }
  if (!slugs.length) return toast('Add some dishes first (combos can\'t be saved)', 'err');
  const nm = window.prompt('Name this order (optional)', 'My usual');
  if (nm === null) return;
  try {
    const res = await fetch('/api/customer/my-usual', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: customerToken, restaurant_slug: r, name: nm.trim() || undefined, item_slugs: slugs })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || 'Could not save');
    toast('Saved to your profile as "' + (nm.trim() || 'My usual') + '"', 'ok');
  } catch (e) { toast(e.message || 'Could not save', 'err'); }
}
function loadUsualIntoCart(combo) {
  let total = 0, added = 0;
  for (const it of combo.items || []) {
    total++;
    const dish = state.menu?.dishes?.find(d => d.slug === it.dish_slug);
    if (!dish || dish.sold_out) continue;
    const key = dish.slug + '::';
    const existing = state.cart.find(i => i.key === key);
    if (existing) existing.qty += 1;
    else state.cart.push({ key, slug: dish.slug, name: dish.name, qty: 1, price_cents: dish.price_cents || 0, modifiers: [] });
    added++;
  }
  saveCart();
  updateActionbar();
  closeSheet();
  toast(`Added ${added} of ${total} items` + (added < total ? ` — ${total - added} unavailable` : ''), added ? 'ok' : 'err');
}

let _callInFlight = false;
async function sendCall(reason) {
  if (_callInFlight) return; // debounce rapid taps
  _callInFlight = true;
  document.querySelectorAll('[data-reason]').forEach(b => b.disabled = true);
  const tbl = table || $('callTable')?.value.trim() || undefined;
  try {
    const res = await fetch('/api/waiter-call', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ r, table: tbl, reason })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Could not send');
    closeSheet();
    toast(d.deduped ? 'Waiter already on their way ✓' : 'Waiter on the way ✓', 'ok');
  } catch (e) {
    toast(e.message, 'err');
    document.querySelectorAll('[data-reason]').forEach(b => b.disabled = false);
  }
  // Reset the in-flight flag after 3s so a legitimate second call later is possible
  setTimeout(() => { _callInFlight = false; }, 3000);
}

          $('grYes').onclick = () => { window.open(d.google_review_url, '_blank', 'noopener'); closeSheet(); };
          $('grNo').onclick = closeSheet;
        }, 250);
      } else {
        closeSheet();
      }
      toast('Thanks for your review ✓', 'ok');
    } catch (e) {
      toast(e.message, 'err');
      // Re-enable so the guest can retry
      $('revSend').disabled = false;
      $('revSend').textContent = _origText;
    }
  };
}

function wireActions() {
  $('cartBtn').onclick   = openCart;
  $('waiterBtn').onclick = openWaiter;
  $('reviewBtn').onclick = openReview;
  $('reserveBtn').onclick = openReserve;
  $('profileBtn').onclick = openProfile;
  // NOTE: the language button is wired inside render() (cycles every language that has
  // translations AND persists the choice). It used to be re-bound here to a settings-only
  // list with no persistence, which made translated-but-unlisted languages unreachable.
}

$('cmpChip').onclick = openCompare;
boot();

// PWA install chip: only after the first scroll, never inside an installed PWA,
// and only once (dismiss or install both set armenu_pwa_prompted).
(function pwaInstallChip() {
  let deferred = null, scrolled = false, shown = false;
  const lsGet = () => { try { return localStorage.getItem('armenu_pwa_prompted'); } catch { return null; } };
  const lsSet = () => { try { localStorage.setItem('armenu_pwa_prompted', String(Date.now())); } catch {} };
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  function show() {
    if (shown || !deferred || !scrolled || lsGet() || standalone()) return;
    shown = true;
    const chip = document.createElement('div');
    chip.id = 'pwaChip';
    chip.setAttribute('role', 'region');
    chip.setAttribute('aria-label', 'Install app');
    chip.style.cssText = 'position:fixed;left:12px;right:12px;bottom:84px;z-index:60;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;background:#13100c;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.6);color:var(--ink);font-size:13px;max-width:420px;margin:0 auto';
    chip.innerHTML = '<button type="button" id="pwaChipGo" style="flex:1;text-align:left;background:none;border:none;color:inherit;font:inherit;cursor:pointer;min-height:40px">📱 Add to home screen for offline menu access</button><button type="button" id="pwaChipX" aria-label="Dismiss" style="background:none;border:none;color:var(--ink-faint);font-size:14px;cursor:pointer;min-width:44px;min-height:44px">✕</button>';
    document.body.appendChild(chip);
    const hide = () => { lsSet(); chip.remove(); };
    chip.querySelector('#pwaChipX').onclick = hide;
    chip.querySelector('#pwaChipGo').onclick = async () => {
      const ev = deferred; deferred = null; hide();
      try { await ev.prompt(); await ev.userChoice; } catch {}
    };
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); if (standalone() || lsGet()) return; deferred = e; show(); });
  window.addEventListener('appinstalled', () => { lsSet(); deferred = null; const c = document.getElementById('pwaChip'); if (c) c.remove(); });
  window.addEventListener('scroll', () => { scrolled = true; show(); }, { passive: true, once: true });
})();
</script>

<script>
/* a11y: dialog focus management — focus in on open, trap Tab, restore focus on close */
(function () {
  var el = document.getElementById('sheet'); if (!el) return;
  var trigger = null, wasOpen = false;
  function isOpen() { return el.classList.contains('on'); }
  function items() { return Array.prototype.filter.call(el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'), function (n) { return n.offsetParent !== null || n === document.activeElement; }); }
  new MutationObserver(function () {
    var open = isOpen();
    if (open && !wasOpen) {
      trigger = document.activeElement;
      setTimeout(function () {
        if (el.contains(document.activeElement) && document.activeElement !== el) return;
        var f = items(); (f[0] || el).focus();
      }, 30);
    } else if (!open && wasOpen) {
      if (trigger && trigger.focus && document.contains(trigger)) { try { trigger.focus(); } catch (e) {} }
      trigger = null;
    }
    wasOpen = open;
  }).observe(el, { attributes: true, attributeFilter: ['class'] });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !isOpen()) return;
    var f = items(); if (!f.length) { e.preventDefault(); return; }
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!el.contains(a)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  }, true);
})();
