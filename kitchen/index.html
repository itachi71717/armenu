<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0806" />
<title>Kitchen · ARMenu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0806;--ink:#f5efe6;--ink-dim:#9a9388;--ink-faint:#7a7266;--accent:#ff5722;--accent-2:#ffb066;--line:rgba(255,239,220,.08);--ok:#7dd87d;--warn:#ffb066;--err:#f87171}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  button,input{font-family:inherit;color:inherit;cursor:pointer;border:none}

  /* Login */
  .login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#0a0806;overflow:hidden}
  .login::before{content:"";position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1466637574441-749b8f19452f?w=2400&q=85&fm=jpg&auto=format');background-size:cover;background-position:center;filter:brightness(.3) saturate(1.2);z-index:-2}
  .login::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%,transparent 20%,rgba(10,8,6,.92) 100%);z-index:-1}
  .login-card{width:min(420px,100%);padding:40px 32px;border-radius:22px;background:linear-gradient(180deg,rgba(18,16,11,.94),rgba(10,8,6,.94));backdrop-filter:blur(20px);border:1px solid rgba(232,197,138,.18);text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.6);position:relative}
  .login-card h1{font-family:'Instrument Serif',serif;font-style:italic;font-size:34px;margin:14px 0 6px;background:linear-gradient(180deg,#fff,#e8c58a);-webkit-background-clip:text;color:transparent}
  .login-card p{color:#a89d84;font-size:14px;margin-bottom:24px}
  .login-card input{background:rgba(245,236,216,.04);border:1px solid rgba(245,236,216,.1)}
  .login-card input:focus{border-color:rgba(232,197,138,.5)}
  .login-card .btn{background:linear-gradient(135deg,#e8c58a,#d4a574);color:#0a0806;font-weight:700;box-shadow:0 14px 30px rgba(212,165,116,.35)}
  .login-card input{width:100%;padding:16px;border-radius:12px;background:rgba(255,239,220,.03);border:1px solid var(--line);font-size:18px;margin-bottom:8px}
  .login-card .pin{letter-spacing:.5em;text-align:center;font-weight:700}
  .login-card .slug{text-align:center;font-size:16px;font-weight:600;letter-spacing:.05em}
  .btn{padding:16px 22px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#c93d00);color:#fff;font-weight:700;font-size:15px}
  .login-card .btn{width:100%;margin-top:6px}
  .err{color:var(--err);font-size:13px;min-height:18px;margin:8px 0}

  header{padding:18px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#080603}
  .h-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px}
  .h-title b{font-style:normal;font-family:'Inter';font-weight:800}
  .h-meta{display:flex;gap:16px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .signout{background:none;color:var(--ink-dim);font-size:12px;padding:8px 14px;border-radius:8px;text-transform:uppercase;letter-spacing:.08em}

  main{padding:24px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;max-width:1800px;margin:0 auto}
  .ticket{border-radius:20px;padding:22px;border:2px solid var(--line);background:linear-gradient(180deg,rgba(255,239,220,.03),rgba(255,239,220,.005));display:flex;flex-direction:column;gap:12px;position:relative;transition:transform .2s,border-color .3s,box-shadow .3s}
  .ticket.new{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,87,34,.15),0 12px 32px rgba(255,87,34,.15);animation:flash .8s ease}
  .ticket.prep{border-color:var(--warn)}
  .ticket.ready{border-color:var(--ok)}
  /* Age-based whole-ticket colouring: <5m green, 5-10m default, 10-20m amber pulse, >20m red hard pulse */
  .ticket.age-fresh{border-color:var(--ok)}
  .ticket.age-amber{border-color:#f0b060;animation:pulseAmber 2.4s ease-in-out infinite}
  .ticket.age-red{border-color:#e05252;animation:pulseRed 1s ease-in-out infinite}
  @keyframes pulseAmber{0%,100%{box-shadow:0 0 0 2px rgba(240,176,96,.12),0 6px 18px rgba(240,176,96,.14)}50%{box-shadow:0 0 0 5px rgba(240,176,96,.28),0 10px 26px rgba(240,176,96,.3)}}
  @keyframes pulseRed{0%,100%{box-shadow:0 0 0 3px rgba(224,82,82,.2),0 8px 24px rgba(224,82,82,.26)}50%{box-shadow:0 0 0 8px rgba(224,82,82,.42),0 14px 36px rgba(224,82,82,.5)}}
  .ticket.focused{outline:3px solid var(--accent-2);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.ticket.age-amber,.ticket.age-red{animation:none}}
  @keyframes flash{0%{background:rgba(255,87,34,.15)}100%{background:transparent}}
  .t-top{display:flex;justify-content:space-between;align-items:center}
  .t-table{font-family:'Instrument Serif',serif;font-style:italic;font-size:30px;font-weight:400}
  .t-table b{font-style:normal;font-family:'Inter';font-weight:900}
  .t-time{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink-dim);font-weight:600}
  .t-age{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,239,220,.06);border:1px solid var(--line)}
  .t-age{font-size:15px;font-weight:700;letter-spacing:.06em}
  .t-age.fresh{background:rgba(125,216,125,.14);color:var(--ok);border-color:rgba(125,216,125,.3)}
  .t-age.warm{background:rgba(255,176,102,.14);color:var(--warn);border-color:rgba(255,176,102,.3)}
  .t-age.hot{background:rgba(248,113,113,.14);color:var(--err);border-color:rgba(248,113,113,.3)}
  .t-items{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
  .t-items li{padding:10px 12px;border-radius:10px;background:rgba(255,239,220,.04);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;transition:opacity .15s,background .15s}
  .t-items li:hover{background:rgba(255,239,220,.07)}
  .t-items li.mine{min-height:60px;padding:14px 14px;align-items:center;border:1px solid rgba(255,176,102,.25)}
  .t-items li.mine .name{font-size:18px}
  .t-items li.ctx{opacity:.4;cursor:default;pointer-events:none}
  .t-items li.recalled{background:rgba(248,113,113,.18);border:1px solid var(--err)}
  .k{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;background:rgba(255,239,220,.1);color:var(--ink-dim);flex:none}
  .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .pill.recall{background:var(--err);color:#0a0806}
  .ctx-label{display:block;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:3px}
  .recall-reason{font-size:12px;color:var(--err);margin-top:3px}
  .h-left{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .h-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(255,239,220,.06);border:1px solid var(--line);color:var(--ink-dim)}
  .chip.expo{background:linear-gradient(135deg,#f3d27a,#d4a017);color:#0a0806;border-color:#d4a017;font-weight:700}
  .help{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--ink-dim);font-size:12px;cursor:help;outline:none}
  .help .help-chip{display:none;position:absolute;top:28px;right:0;white-space:nowrap;background:#1a1611;border:1px solid var(--line);padding:8px 12px;border-radius:8px;color:var(--ink);text-transform:none;letter-spacing:.02em;z-index:5}
  .help:hover .help-chip,.help:focus .help-chip{display:block}
  #rushBanner{display:none;padding:12px 16px;text-align:center;background:#c81e1e;color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
  #rushBanner.show{display:block}
  .t-items li.done{opacity:.35;background:rgba(125,216,125,.06)}
  .t-items li.done .name,.t-items li.done .qty{text-decoration:line-through}
  .t-items .qty{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--accent);font-size:18px;min-width:34px}
  .t-items .name{flex:1;font-size:16px;font-weight:600}
  .t-items .note{font-size:12px;color:var(--warn);margin-top:3px;font-style:italic}
  .t-note{background:rgba(255,176,102,.06);border-left:3px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--warn)}
  .t-actions{display:flex;gap:8px;margin-top:auto}
  .t-actions button{flex:1;padding:14px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .btn-prep{background:linear-gradient(135deg,var(--warn),#c98a3d);color:#0a0806}
  .btn-ready{background:linear-gradient(135deg,var(--ok),#4ea54e);color:#0a0806}
  .btn-served{background:rgba(154,147,136,.14);color:var(--ink-dim);border:1px solid var(--line)}

  #board .empty-state{grid-column:1/-1;padding:100px 24px}
  #board .empty-state::before{font-size:64px;margin-bottom:20px}
  #board .empty-state h3{font-family:'Instrument Serif',serif;font-style:italic;font-size:36px;font-weight:400;color:var(--ink);margin-bottom:10px}
  #board .empty-state p{font-size:15px}

  /* Connectivity heartbeat banner — hidden unless the last poll/SSE tick is stale */
  #offlineBanner{display:none;padding:10px 16px;text-align:center;background:rgba(248,113,113,.14);border-bottom:1px solid var(--err);color:var(--err);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  #offlineBanner.show{display:block}

</style>
<script src="/vendor/armenu-errorbar.js" defer></script>
<script src="/vendor/armenu-sounds.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-a11y.css">
  <script src="/vendor/sentry-client.js" defer></script>
<script src="/vendor/cookie-consent.js" defer></script>
<script src="/vendor/push-optin.js" defer></script>
</head>
<body>

<div id="offlineBanner">⚠ Offline — orders may not appear</div>

<div id="rushBanner">⚡ RUSH — kitchen busy</div>

<div class="login" id="login">
  <div class="login-card">
    <img src="/favicon.svg" alt="ARMenu" style="width:60px;height:60px;filter:drop-shadow(0 10px 24px rgba(212,165,116,.4))" />
    <h1>Kitchen display</h1>
    <p>Sign in with a manager PIN.</p>
    <input id="loginSlug" class="slug" placeholder="restaurant-slug" autocomplete="off" />
    <input id="loginPin" class="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" />
    <input id="loginStation" class="slug" placeholder="e.g. hot, cold, expo — leave blank to see all" autocomplete="off" />
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">Enter kitchen →</button>
  </div>
</div>

<header>
  <div class="h-left">
    <div class="h-title"><b>Kitchen</b> · <span id="whoRestaurant">—</span></div>
    <div class="h-chips" id="stationChips"></div>
  </div>
  <div class="h-meta"><span class="live-dot"></span> Live · <span id="clock">--:--</span> · <span id="orderCount">0 orders</span>
    <span class="help" tabindex="0" id="helpIcon" aria-label="Keyboard shortcuts">?<span class="help-chip">1-9: mark item · Enter: ready · Esc: next</span></span></div>
  <button class="signout" id="signout">Sign out</button>
</header>

<main id="board">
  <div class="sk-card" style="height:220px"></div>
  <div class="sk-card" style="height:220px"></div>
  <div class="sk-card" style="height:220px"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const toast = m => window.ArmenuFX?.toast(m);
let session = null;
try { session = JSON.parse(localStorage.getItem('armenu_kitchen_session') || 'null'); } catch {}
// Manager hand-off: /kitchen/?r=<slug>&portal_token=<...> → auto-login
(() => {
  const q = new URLSearchParams(location.search);
  const r = q.get('r'); const pt = q.get('portal_token'); const st = (q.get('station') || '').trim().toLowerCase();
  // Pre-fill the login form from ?r=<slug>&station=<station-slug> (station QR / login card)
  if (r && !pt) {
    const rEl = document.getElementById('loginSlug'), sEl = document.getElementById('loginStation');
    if (rEl && !rEl.value) rEl.value = r.trim().toLowerCase();
    if (sEl && st) sEl.value = st;
    const pinEl = document.getElementById('loginPin');
    if (pinEl && !session) setTimeout(() => { try { pinEl.focus(); } catch {} }, 0);
  }
  if (r && pt) {
    fetch('/api/staff/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(st ? { r, portal_token: pt, station_slug: st } : { r, portal_token: pt }) })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          session = data;
          localStorage.setItem('armenu_kitchen_session', JSON.stringify(session));
          history.replaceState({}, '', '/kitchen/');
          location.reload();
        }
      }).catch(() => {});
  }
})();
let poll = null, es = null, tickTimer = null;
let previousIds = new Set();
// Station / multi-screen state
let stationName = '', isExpo = false;
// Board state
let lastOrders = [], focusedOrderId = null;
let rushOrderTimes = [];            // created_at ms of rush orders currently on the board
let recallSeen = new Set(), recallSeeded = false;
let _tickCount = 0;
const RUSH_WINDOW_MS = 3 * 60 * 1000;

// ---- Heartbeat / offline detection ----
// lastTickAt is bumped on every successful poll or SSE event. If 15s pass
// without one, we assume the network dropped and warn the operator.
let hbTimer = null;
let lastTickAt = Date.now();
function markTick() { lastTickAt = Date.now(); hideOfflineBanner(); }
function showOfflineBanner() { $('offlineBanner')?.classList.add('show'); }
function hideOfflineBanner() { $('offlineBanner')?.classList.remove('show'); }
function checkHeartbeat() {
  if (!session) return;
  if (Date.now() - lastTickAt > 15000) showOfflineBanner();
}

// ---- Notification fallback ----
// Browser Notification API as a visual fallback for when sound fails
// (suspended tab, muted device). No-op wherever unsupported.
function ensureNotifyPermission() {
  try {
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } catch {}
}
function fireOrderNotification(count) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification(count > 1 ? `${count} new orders` : 'New order', { body: 'New order in the kitchen queue', tag: 'armenu-kitchen-order' });
  } catch {}
}

function fireRecallNotification(count) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification(count > 1 ? `${count} items recalled` : 'Item recalled', { body: 'An item was sent back to the kitchen', tag: 'armenu-kitchen-recall' });
  } catch {}
}

// ---- Tab title / favicon pulse fallback ----
// Last-resort visual signal when sound + notification both fail: flash the
// tab title with an unread count and swap the favicon to a red-dot version.
// Resets as soon as the operator focuses the tab back.
const KITCHEN_TITLE = 'Kitchen';
let unreadOrders = 0;
let _faviconLink = null, _faviconOrigHref = null;
function ensureFaviconLink() {
  if (_faviconLink) return _faviconLink;
  _faviconLink = document.querySelector('link[rel="icon"]') || document.querySelector('link[rel="shortcut icon"]');
  if (!_faviconLink) { _faviconLink = document.createElement('link'); _faviconLink.rel = 'icon'; document.head.appendChild(_faviconLink); }
  _faviconOrigHref = _faviconLink.getAttribute('href') || '/favicon.svg';
  return _faviconLink;
}
function pulseFavicon(on) {
  try {
    const link = ensureFaviconLink();
    if (!on) { link.href = _faviconOrigHref; return; }
    const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d'); if (!ctx) return;
    ctx.fillStyle = '#0a0806'; ctx.beginPath(); ctx.arc(16, 16, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f87171'; ctx.beginPath(); ctx.arc(16, 16, 10, 0, Math.PI * 2); ctx.fill();
    link.href = canvas.toDataURL('image/png');
  } catch {}
}
function bumpUnreadOrders(n) {
  if (!document.hidden) return; // operator is already looking at the board
  unreadOrders += n;
  document.title = `(${unreadOrders}) ${KITCHEN_TITLE}`;
  pulseFavicon(true);
}
function resetUnreadOrders() {
  unreadOrders = 0;
  document.title = KITCHEN_TITLE + ' · ARMenu';
  pulseFavicon(false);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resetUnreadOrders(); });
window.addEventListener('focus', resetUnreadOrders);

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(session?.token ? { authorization: 'Bearer ' + session.token } : {}), ...(opts.headers || {}) } });
  if (res.status === 401) { signOut(); throw new Error('unauth'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'Request failed'); err.status = res.status; throw err; }
  return data;
}

$('loginBtn').onclick = async () => {
  const r = $('loginSlug').value.trim().toLowerCase();
  const pin = $('loginPin').value.trim();
  if (!r || !pin) return $('loginErr').textContent = 'Both fields required';
  const btn = $('loginBtn'); if (btn.disabled) return;
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span>Entering…';
  ensureNotifyPermission(); // first user interaction — safe point to ask
  try {
    const stationTyped = $('loginStation').value.trim();
    const loginBody = { r, pin };
    if (stationTyped) loginBody.station_slug = stationTyped.toLowerCase();
    const res = await fetch('/api/staff/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(loginBody) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Login failed');
    session = data;
    session.station_name = data.station?.name || data.station_name || (stationTyped ? (data.station_slug || stationTyped) : '');
    session.is_expo = !!(data.is_expo || data.station?.is_expo);
    localStorage.setItem('armenu_kitchen_session', JSON.stringify(session));
    onIn();
  } catch (e) {
    $('loginErr').textContent = e.message;
    btn.disabled = false; btn.innerHTML = orig;
  }
};
$('loginPin').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
$('loginStation').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };

function signOut() {
  localStorage.removeItem('armenu_kitchen_session');
  session = null;
  if (poll) clearInterval(poll);
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  try { es?.close(); } catch {}
  hideOfflineBanner();
  resetUnreadOrders();
  stationName = ''; isExpo = false; lastOrders = []; focusedOrderId = null; rushOrderTimes = [];
  recallSeen = new Set(); recallSeeded = false; previousIds = new Set();
  renderStationChips(); updateRushBanner();
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'Enter kitchen →';
  $('login').style.display = 'grid';
}
$('signout').onclick = signOut;

// Idle timeout — auto-signout after 12h idle so an abandoned tablet stops leaking data.
const IDLE_MS = 12 * 60 * 60 * 1000;
let _idleAt = Date.now();
['pointerdown','keydown','touchstart','mousemove'].forEach(ev =>
  window.addEventListener(ev, () => { _idleAt = Date.now(); }, { passive: true })
);
setInterval(() => {
  if (session && Date.now() - _idleAt > IDLE_MS) { toast('Signed out — tablet was idle for 12h'); signOut(); }
}, 60_000);

function onIn() {
  $('login').style.display = 'none';
  $('whoRestaurant').textContent = session.restaurant.name;
  stationName = session.station_name || session.station?.name || '';
  isExpo = !!(session.is_expo || session.station?.is_expo);
  renderStationChips();
  // Idempotent: clear any prior timers/SSE from a previous onIn() before
  // arming new ones. Without this, every SSE reconnect stacks another
  // 12s poll and 1Hz tick until the tab is a hundred timers deep.
  if (poll) { clearInterval(poll); poll = null; }
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  if (es) { try { es.close(); } catch {} es = null; }
  lastTickAt = Date.now();
  hideOfflineBanner();
  tick();
  refresh();
  poll = setInterval(refresh, 12000);
  tickTimer = setInterval(tick, 1000);
  hbTimer = setInterval(checkHeartbeat, 5000);
  try {
    es = new EventSource('/api/events?token=' + encodeURIComponent(session.token));
    es.onopen = () => markTick();
    es.addEventListener('orders', () => { markTick(); refresh(); });
    es.onerror = () => { try { es.close(); } catch {} es = null; setTimeout(() => { if (session) onIn(); }, 4000); };
  } catch {}
  registerCmdK();
}

// Command palette — skipped on touch-only kiosks (speed over discoverability).
// Registers once; commands call the same functions the on-screen controls do.
let _cmdkRegistered = false;
function registerCmdK() {
  if (_cmdkRegistered || !window.ArmenuCmdK) return;
  if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return;
  _cmdkRegistered = true;
  window.ArmenuCmdK.register([
    { id: 'sign-out', label: 'Sign out', run: signOut },
    { id: 'fullscreen', label: 'Fullscreen', run: () => document.documentElement.requestFullscreen?.() },
    { id: 'toggle-sounds', label: 'Turn sounds off/on', run: () => toast(window.ArMenuSound?.toggle() ? 'Sounds off' : 'Sounds on') },
    { id: 'refresh', label: 'Refresh', run: refresh }
  ]);
}
// armenu-cmdk.js loads deferred, so a boot-with-existing-session's onIn()
// call above may fire before it lands; retry once the deferred scripts land.
document.addEventListener('DOMContentLoaded', registerCmdK);

function tick() {
  const d = new Date(); $('clock').textContent = d.toTimeString().slice(0, 5);
  // Live-tick ticket ages between polls so a table waiting 14 minutes doesn't
  // look like it's been 8 minutes for four seconds after the last refresh.
  // One shared 1s interval drives every ticket's MM:SS timer; age colours
  // are re-evaluated every 15th tick (applyAges also runs after each render).
  _tickCount++;
  const doAges = _tickCount % 15 === 0;
  document.querySelectorAll('.ticket[data-created]').forEach(el => {
    const created = parseInt(el.dataset.created, 10);
    if (!created) return;
    const badge = el.querySelector('.t-age');
    if (badge) badge.textContent = fmtElapsed(Date.now() - created);
    if (doAges) applyAge(el);
  });
  if (doAges) updateRushBanner();
}

function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
// <5m green, 5-10m default, 10-20m amber pulse, >20m red hard pulse.
function ageBucket(ms) {
  const m = ms / 60000;
  return m < 5 ? 'fresh' : m < 10 ? '' : m < 20 ? 'amber' : 'red';
}
function applyAge(el) {
  const created = parseInt(el.dataset.created, 10);
  if (!created) return;
  const b = ageBucket(Date.now() - created);
  el.classList.toggle('age-fresh', b === 'fresh');
  el.classList.toggle('age-amber', b === 'amber');
  el.classList.toggle('age-red', b === 'red');
  const badge = el.querySelector('.t-age');
  if (badge) {
    badge.classList.toggle('fresh', b === 'fresh');
    badge.classList.toggle('warm', b === 'amber');
    badge.classList.toggle('hot', b === 'red');
  }
}

function renderStationChips() {
  const box = $('stationChips'); if (!box) return;
  box.innerHTML = '';
  if (stationName) {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = 'Station: ' + stationName; box.appendChild(c);
  }
  if (isExpo) {
    const p = document.createElement('span'); p.className = 'chip expo'; p.textContent = 'EXPO — all orders'; box.appendChild(p);
  }
}

// Rush mode: active while any rush order was created within the last 3 minutes.
function rushActive() {
  const now = Date.now();
  return rushOrderTimes.some(t => now - t < RUSH_WINDOW_MS);
}
function updateRushBanner() {
  $('rushBanner')?.classList.toggle('show', !!session && rushActive());
}

async function refresh() {
  try {
    const { orders } = await api('/api/staff/orders');
    markTick();
    const kitchen = (orders || []).filter(o => ['new','prep','ready'].includes(o.status));
    $('orderCount').textContent = `${kitchen.length} order${kitchen.length === 1 ? '' : 's'}`;
    lastOrders = kitchen;
    rushOrderTimes = kitchen.filter(o => o.rush === true).map(o => new Date(o.created_at).getTime()).filter(Boolean);
    render(kitchen);
    updateRushBanner();
    // Ding for new orders
    const currIds = new Set(kitchen.map(o => o.id));
    let newCount = 0;
    for (const id of currIds) if (!previousIds.has(id)) newCount++;
    if (newCount > 0) { beep(rushActive()); fireOrderNotification(newCount); bumpUnreadOrders(newCount); }
    previousIds = currIds;
    // Recalled items: chime + notification once per recall event (silent on first load)
    let newRecalls = 0;
    for (const o of kitchen) for (const it of (o.order_items || [])) {
      if (!it.recalled_at) continue;
      const key = it.id + ':' + it.recalled_at;
      if (!recallSeen.has(key)) { recallSeen.add(key); if (recallSeeded) newRecalls++; }
    }
    recallSeeded = true;
    if (newRecalls > 0) { beep(true); fireRecallNotification(newRecalls); bumpUnreadOrders(newRecalls); }
  } catch (e) { console.error(e); }
}

function render(orders) {
  if (!orders.length) { focusedOrderId = null; $('board').innerHTML = `<div class="empty-state" id="emptyState" data-icon="🎉"><h3>All caught up.</h3><p>Great work. New orders will appear here.</p></div>`; return; }
  if (!orders.some(o => o.id === focusedOrderId)) focusedOrderId = orders[0].id;
  $('board').innerHTML = orders.map(o => {
    const createdMs = new Date(o.created_at).getTime();
    const items = o.order_items || [];
    // Station filtering applies only when the API marks items with `mine`.
    const filtered = items.some(it => 'mine' in it);
    let n = 0;
    const lis = items.map(it => {
      const isCtx = filtered && it.mine !== true;
      const recalled = !!it.recalled_at;
      const cls = [isPlated(it) ? 'done' : '', isCtx ? 'ctx' : (filtered ? 'mine' : ''), recalled ? 'recalled' : ''].filter(Boolean).join(' ');
      const idx = isCtx ? 0 : ++n;
      return `<li data-item="${o.id}:${it.id}" class="${cls}">
        ${idx && idx <= 9 ? `<span class="k" aria-hidden="true">${idx}</span>` : ''}
        <span class="qty">×${it.qty}</span>
        <div class="name">${escapeHTML(it.dish_name)}${recalled ? '<span class="pill recall">RECALLED</span>' : ''}
          ${recalled && it.recall_reason ? `<div class="recall-reason">${escapeHTML(it.recall_reason)}</div>` : ''}
          ${Array.isArray(it.modifiers) && it.modifiers.length ? '<ul class="mods" style="margin:4px 0 0 0;padding:0;list-style:none">' + it.modifiers.map(m => '<li style="font-size:12px;color:var(--warn);padding:2px 0">↳ ' + escapeHTML(m.name) + '</li>').join('') + '</ul>' : ''}
          ${it.note ? `<div class="note">${escapeHTML(it.note)}</div>` : ''}
          ${it.complimentary ? '<div class="note" style="color:var(--ok)">(complimentary)</div>' : ''}
          ${isCtx ? '<span class="ctx-label">context — other station</span>' : ''}
        </div>
      </li>`;
    }).join('');
    return `<div class="ticket ${o.status}" data-order="${o.id}" data-status="${o.status}" data-created="${createdMs}">
      <div class="t-top">
        <div class="t-table">${o.table_label ? `<b>${escapeHTML(o.table_label)}</b>` : 'Walk-up'}${o.rush ? '<span class="pill recall">⚡ RUSH</span>' : ''}</div>
        <div class="t-age">${fmtElapsed(Date.now() - createdMs)}</div>
      </div>
      <ul class="t-items" title="Tap items to mark plated — synced across kitchen screens">${lis}</ul>
      ${o.guest_note ? `<div class="t-note">📝 ${escapeHTML(o.guest_note)}</div>` : ''}
      <div class="t-actions">
        ${o.status === 'new' ? `<button class="btn-prep" data-mark="${o.id}:prep">Start prep</button>` : ''}
        ${o.status === 'prep' ? `<button class="btn-ready" data-mark="${o.id}:ready">Ready</button>` : ''}
        ${o.status === 'ready' ? `<button class="btn-served" data-mark="${o.id}:served">Served</button>` : ''}
        ${o.status === 'served' || o.status === 'ready' ? `<button class="btn-undo" data-mark="${o.id}:${o.status === 'served' ? 'ready' : 'prep'}" style="background:rgba(245,239,220,.06);color:var(--ink-dim);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-size:13px;min-height:44px;cursor:pointer">↶ Undo</button>` : ''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-mark]').forEach(b => b.onclick = async () => {
    const [id, status] = b.dataset.mark.split(':');
    try { await api('/api/staff/orders?id=' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); refresh(); }
    catch (e) { toast(e.message); }
  });
  // Tap a line-item to mark it done inside the ticket (client-side only —
  // no schema change; kitchen-local ephemeral state).
  document.querySelectorAll('.t-items li[data-item]').forEach(li => li.onclick = () => togglePlated(li));
  // Clicking anywhere on a ticket focuses it for bump-bar shortcuts.
  document.querySelectorAll('.ticket[data-order]').forEach(el => el.addEventListener('click', () => setFocus(el.dataset.order)));
  document.querySelectorAll('.ticket[data-created]').forEach(applyAge);
  applyFocus();
}

// ---- Bump-bar (keyboard) ----
function applyFocus() {
  document.querySelectorAll('.ticket[data-order]').forEach(el => el.classList.toggle('focused', el.dataset.order === String(focusedOrderId)));
}
function setFocus(id) { focusedOrderId = id; applyFocus(); }
function focusNext() {
  if (!lastOrders.length) return;
  const i = lastOrders.findIndex(o => String(o.id) === String(focusedOrderId));
  setFocus(lastOrders[(i + 1) % lastOrders.length].id);
  document.querySelector('.ticket.focused')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
document.addEventListener('keydown', async e => {
  if (!session || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if (getComputedStyle($('login')).display !== 'none') return;
  const order = lastOrders.find(o => String(o.id) === String(focusedOrderId));
  if (e.key === 'Escape') { e.preventDefault(); focusNext(); return; }
  if (!order) return;
  if (/^[1-9]$/.test(e.key)) {
    const el = document.querySelector('.ticket[data-order="' + CSS.escape(String(order.id)) + '"]');
    const li = el && el.querySelectorAll('.t-items li[data-item]:not(.ctx)')[parseInt(e.key, 10) - 1];
    if (li) { e.preventDefault(); togglePlated(li); }
  } else if (e.key === 'Enter') {
    if (t && t.tagName === 'BUTTON') return; // let a focused button handle its own Enter
    if (order.status === 'ready' || order.status === 'served') return;
    e.preventDefault();
    try { await api('/api/staff/orders?id=' + order.id, { method: 'PATCH', body: JSON.stringify({ status: 'ready' }) }); refresh(); }
    catch (err) { toast(err.message); }
  }
});

// "Plated" ticks are server-driven (order_items.plated_at) so every kitchen
// tablet on the restaurant sees the same state in real time. If the API
// hasn't been deployed yet (404/501 on the PATCH), fall back to the old
// localStorage-only behaviour for the rest of this session so a mid-deploy
// tablet doesn't break.
let plateApiDown = false;
function isPlated(it) {
  if (plateApiDown) return itemDone(it.order_id, it.id);
  return !!it.plated_at;
}
async function togglePlated(li) {
  const [oid, iid] = li.dataset.item.split(':');
  const wasDone = li.classList.contains('done');
  const next = !wasDone;
  li.classList.toggle('done', next);
  if (plateApiDown) { toggleItemDone(oid, iid); return; }
  try {
    await api('/api/staff/orders?item=' + encodeURIComponent(iid) + '&plated=' + (next ? '1' : '0'), { method: 'PATCH' });
  } catch (e) {
    if (e.status === 404 || e.status === 501) {
      plateApiDown = true;
      toggleItemDone(oid, iid);
      return;
    }
    li.classList.toggle('done', wasDone); // revert optimistic UI
    toast(e.message || 'Could not update item');
  }
}

// Legacy per-order item strike-through, persisted in localStorage. Only
// used as a fallback when the server-side plated_at API is unavailable.
function itemDoneKey() { return 'armenu_kitchen_item_done'; }
function loadItemDone() {
  try { return JSON.parse(localStorage.getItem(itemDoneKey()) || '{}'); } catch { return {}; }
}
function itemDone(orderId, itemId) {
  const m = loadItemDone();
  return !!(m[orderId] && m[orderId][itemId]);
}
function toggleItemDone(orderId, itemId) {
  const m = loadItemDone();
  if (!m[orderId]) m[orderId] = {};
  m[orderId][itemId] = !m[orderId][itemId];
  if (!m[orderId][itemId]) delete m[orderId][itemId];
  if (Object.keys(m[orderId]).length === 0) delete m[orderId];
  try { localStorage.setItem(itemDoneKey(), JSON.stringify(m)); } catch {}
}

// Reused AudioContext — some browsers throttle after too many one-off ctxs.
let _kbeepCtx = null;
function beep(rush) {
  if (window.ArMenuSound?.muted?.()) return;
  try {
    if (!_kbeepCtx) _kbeepCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Inactive tabs suspend the AudioContext — check and resume on every attempt.
    if (_kbeepCtx.state === 'suspended') _kbeepCtx.resume?.();
    const now = _kbeepCtx.currentTime;
    // Two-tone chirp (E5 -> A5) with a soft envelope so it's noticeable not annoying.
    // Rush mode: higher pitch (B5/E6 x2) and a faster cadence.
    const tones = rush ? [[987.77, 0], [1318.5, 0.09], [987.77, 0.24], [1318.5, 0.33]] : [[659.25, 0], [880, 0.13]];
    const len = rush ? 0.08 : 0.16;
    tones.forEach(([freq, t]) => {
      const o = _kbeepCtx.createOscillator();
      const g = _kbeepCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.value = 0.0001;
      g.gain.exponentialRampToValueAtTime(0.18, now + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + len);
      o.connect(g); g.connect(_kbeepCtx.destination);
      o.start(now + t); o.stop(now + t + len + 0.01);
    });
  } catch {}
}

function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Keep screen awake (only works with user gesture on iOS/Android)
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
  addEventListener('click', () => { navigator.wakeLock?.request('screen').catch(() => {}); }, { once: true });
}

if (session?.token) onIn();
</script>
<link rel="stylesheet" href="/vendor/armenu-fx.css">
<script defer src="/vendor/armenu-fx.js"></script>
<script defer src="/vendor/armenu-cmdk.js"></script>
</body>
