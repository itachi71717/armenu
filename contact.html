<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact. ARMenu</title>
<meta name="theme-color" content="#0a0806" />
<meta name="description" content="Talk to ARMenu — enquiries, support and enterprise sales for South Africa's AR restaurant menu platform." />
<meta property="og:title" content="Contact. ARMenu" />
<meta property="og:description" content="Get in touch with ARMenu to bring augmented reality dishes to your restaurant." />
<meta property="og:image" content="https://armenu.co.za/favicon.svg" />
<meta property="og:url" content="https://armenu.co.za/contact.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Contact. ARMenu" />
<meta name="twitter:description" content="Get in touch with ARMenu to bring augmented reality dishes to your restaurant." />
<meta name="twitter:image" content="https://armenu.co.za/favicon.svg" />
<link rel="canonical" href="https://armenu.co.za/contact.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0806;--ink:#f5efe6;--ink-dim:#9a9388;--ink-faint:#7a7266;--accent:#d4a574;--accent-2:#e8c58a;--line:rgba(245,236,216,.08);--serif:'Instrument Serif',serif;--mono:'JetBrains Mono',monospace}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  a{color:inherit;text-decoration:none}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .brand b{font-weight:800}.brand i{font-style:normal;color:var(--ink-dim);font-weight:500;margin-left:3px}
  main{max-width:640px;margin:0 auto;padding:140px 24px 60px}
  #kicker,#pageTitle{scroll-margin-top:110px}
  h1{font-family:var(--serif);font-style:italic;font-size:clamp(38px,7vw,58px);font-weight:400;margin-bottom:12px;background:linear-gradient(180deg,#fff,var(--accent-2));-webkit-background-clip:text;color:transparent}
  .kicker{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
  .lead{color:var(--ink-dim);font-size:16px;line-height:1.5;margin-bottom:36px}
  .tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
  .tab{padding:9px 14px;border-radius:10px;background:rgba(245,236,216,.04);border:1px solid var(--line);color:var(--ink-dim);font-size:13px;cursor:pointer}
  .tab.on{background:rgba(212,165,116,.14);color:var(--accent);border-color:rgba(212,165,116,.28)}
  .row{margin-bottom:14px}
  .row label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:6px}
  .row input,.row textarea{width:100%;padding:12px 14px;border-radius:10px;background:rgba(245,236,216,.03);border:1px solid var(--line);font-size:14px;color:var(--ink);font-family:inherit}
  .btn{padding:14px 24px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#a8763b);color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer}
  .ok{color:#7dd87d;font-size:14px;margin-top:12px}
  .contact-info{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--ink-dim);font-size:13px;line-height:1.7}
  .contact-info strong{color:var(--ink)}
</style>
<script src="/vendor/armenu-errorbar.js" defer></script>
<script src="/vendor/armenu-sounds.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-a11y.css">
  <script src="/vendor/sentry-client.js" defer></script>
<script src="/vendor/cookie-consent.js" defer></script>
</head>
<body>
<div id="mkNav"></div>

<main>
  <div class="kicker" id="kicker">Contact</div>
  <h1 id="pageTitle">Talk to us.</h1>
  <p class="lead" id="pageLead">Setup takes minutes and we'll walk your first restaurant through it live if you want.</p>

  <div class="tabs">
    <div class="tab on" data-type="general">General enquiry</div>
    <div class="tab" data-type="billing">Support / billing</div>
    <div class="tab" data-type="enterprise">Enterprise</div>
  </div>

  <form id="contactForm">
    <div class="row"><label>Your name</label><input required id="name" /></div>
    <div class="row"><label>Email</label><input required type="email" id="email" /></div>
    <div class="row"><label>Restaurant / venue</label><input id="restaurant" /></div>
    <div class="row"><label>Message</label><textarea required id="message" rows="5"></textarea></div>
    <input type="hidden" id="type" value="general" />
    <input type="hidden" id="utm_source" name="utm_source" value="" />
    <button class="btn" type="submit">Send →</button>
    <div class="ok" id="ok" style="display:none">✓ Thanks. we'll be in touch within a business day.</div>
  </form>

  <div class="contact-info">
    <strong>Contact:</strong> <a href="/contact" style="color:#e8c58a">via our contact form</a><br>
    <strong>WhatsApp:</strong> <a href="https://wa.me/27683282991" target="_blank" rel="noopener" style="color:#25D366;text-decoration:none">WhatsApp</a><br>
    <strong>Address:</strong> Johannesburg, South Africa
  </div>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const type = p.get('type') || 'general';
  // Populate utm_source from URL param, referrer host, or 'direct' — persist across the session.
  try {
    let utm = p.get('utm_source') || sessionStorage.getItem('utm_source');
    if (!utm) {
      if (document.referrer) { try { utm = new URL(document.referrer).hostname; } catch { utm = ''; } }
      if (!utm) utm = 'direct';
    }
    sessionStorage.setItem('utm_source', utm);
    document.getElementById('utm_source').value = utm;
  } catch {}
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
      t.classList.add('on');
      document.getElementById('type').value = t.dataset.type;
      updateHeader(t.dataset.type);
    };
    if (t.dataset.type === type) t.click();
  });
  function updateHeader(t) {
    const cfg = { general: ['Contact', 'Talk to us.', "Setup takes minutes and we'll walk your first restaurant through it live if you want."], billing: ['Support', "We're here to help.", 'Send us your restaurant slug + a description and we\'ll respond within a business day.'], enterprise: ['Enterprise', "Let's build it together.", 'For chains, hotel groups & luxury venues. Custom animation, unlimited seats, dedicated support.'] }[t] || [];
    if (cfg[0]) { document.getElementById('kicker').textContent = cfg[0]; document.getElementById('pageTitle').textContent = cfg[1]; document.getElementById('pageLead').textContent = cfg[2]; }
  }
  document.getElementById('contactForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    // Use explicit lookups — the browser's implicit id → global binding
    // shadows the id "name" with window.name (a string), so `name.value`
    // was undefined and every submission previously POSTed an empty name.
    const $c = id => document.getElementById(id);
    const body = { name: $c('name').value, email: $c('email').value, restaurant: $c('restaurant').value, message: $c('message').value, type: $c('type').value, utm_source: $c('utm_source').value };
    // Fire-and-forget: attempts a serverless endpoint if you add one; else falls back to mailto.
    try {
      const r = await fetch('/api/contact', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { document.getElementById('ok').style.display = 'block'; e.target.reset(); btn.disabled = false; btn.textContent = orig; return; }
      if (r.status === 429) { btn.disabled = false; btn.textContent = orig; alert(d.error || 'Too many submissions — try again later.'); return; }
    } catch {}
    // Fallback: open WhatsApp
    btn.disabled = false; btn.textContent = orig;
    location.href = `https://wa.me/27683282991?text=${encodeURIComponent('[' + body.type + '] ' + body.name + ' from ' + body.restaurant + ': ' + body.message)}`;
  };
</script>
<div id="mkFooter"></div>

<script src="/vendor/marketing-chrome.js" defer></script>
<link rel="stylesheet" href="/vendor/armenu-fx.css">
<script defer src="/vendor/armenu-fx.js"></script>
<script defer src="/vendor/armenu-cmdk.js"></script>
</body>
</html>
